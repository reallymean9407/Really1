  <script id="diary-data" type="application/json">[{"date": "2026. 6. 29", "sortDate": "2026-06-29", "title": "미국 중간선거에 개입하기 시작하는 AI Money...!", "core": "- 저번주에 뉴욕 12선거구에서 규제완화(openAI)vs규제강화(Anthropic) > 엄청난 정치 자금 투입 > 규제완화 측, 의원이 승리(고작 5000표 차이)\n- 유동성 긴축우려가 강해지면, AI매출이 확실한 곳으로 돈이 몰림. 반대로, 긴축우려가 줄어들어야 섹터 전체 훈풍\n- Exponential View의 조사에 따르면 중국을 제외한 전세계 AI 매출이 처음으로 분기 250억 달러를 찍었는데, 데이터센터 감가상각 비용인 210억 달러를 넘어선 수치\n(감가 상각 기간을 6년으로 계산 > 마이크버리의 2년 예상보다 훨씬 김)"}, {"date": "2026. 6. 30", "sortDate": "2026-06-30", "title": "빠르게 커지는 우주 통신과 인공위성 산업 (ft. RKLB+IRDM)", "core": "- 로켓랩, 이리듐 인수 > 이리듐의 인수 가치는 저궤도 네트워크 + 위성통신용으로 쓸 수 있는 ‘무선 주파수(Spectrum)’\n- 로켓랩은 부품 제작부터 완성품 조립, 로봇 개발, 발사 능력, 인공위성 운영, 고객 서비스 + 주파수까지 모든 분야를 커버하는 회사가 되었습니다.\n- 얼마 전 로켓랩이 사상 최대 분기 매출($200M)을 찍은 걸 기억하실텐데,이리듐의 작년 매출은 로켓랩의 $602M보다도 큰 $871M에 달합니다.\n거기에 EBITDA는 $495M로 마진율이 57%나 되고, 1,000명의 직원과 255만명의 구독 고객, 66기의 인공위성을 보유 중입니다.\n정부와의 계약도 맺고 있는 회사다보니 B2G, 방산 계약을 맺기에도 더 수월해질 것 같습니다."}, {"date": "2026. 7. 1", "sortDate": "2026-07-01", "title": "스테이블코인 발행사에서 유통사로 넘어가는 칼자루 (ft. Open USD)", "core": "- 써클 경쟁사 출현, 오픈스탠다드의 OUSD (파트너사 149개) > 써클(주요 고객사인 코베에게 수익금 나눔), 오픈스탠다드(모든 고객에게 수익금 나눔)\n\n- 스테이블코인 발행사 단일 브랜드에 투자하기보다는, 어떤 브랜드가 성장하든 이득을 보는 곳에 투자하는 게 더 합리적으로 보이네요.\n가장 이득을 보는 건 스테이블코인 인프라를 제공하는 Bridge...를 인수한 Stripe인데 비상장 회사라 당장 투자하기엔 조금 어렵고, 코인베이스는 기존 써클과의 관계에 더해\n보험 성격으로 오픈스탠다드를 걸쳐둔 셈이라 발행사보다는 더 안전한 베팅이 될 것 같습니다.\n+) 페이스북이나 카카오톡처럼 기술적 해자는 없고 사용자 수(=네트워크 효과)가 해자가 되는 비즈니스인데, 요즘은 워낙 스왑이 싸고 잘돼있어서 네트워크 효과가 약해지는 것 같습니다"}, {"date": "2026. 7. 2", "sortDate": "2026-07-02", "title": "모 아니면 도, 빅테크 투자 축소의 신호탄 VS 하이퍼스케일러 경쟁 심화 (ft. META)", "core": "- (5월, 메타 : 투자과잉이 되면 연산력을 팔겠다.) > 7월, 메타 : 연산력 판다!! > 나도 네오클라우드 사업 해볼래!! > 하이퍼스케일러 고객인, 메모리와 기존 네오클라우드 폭락\n> (이미 CapEx 우려 품고 있던) 하이퍼스케일러 반등\n>> 투자 과잉이라고 판단하기에는 시기상조 > 바로 이틀 전 구글이 메타의 AI 사용량을 제한한다는 소식이 나올 정도로 연산력이 부족한 상황"}, {"date": "26/7/3(LIVE)", "sortDate": "2026-07-03", "title": "26년 하반기 투자 타임라인 점검", "core": "- 시장이 모두 상승을 바라보고만 있는 상태 : 콜옵션(99%), 본주를 팔고 레버리지로 갈아타는 현상\n\n- 빅테크에서 CapEx를 줄여야 시장에서 긍정적으로 보는 상황 > 하지만 어느 한 곳도 CapEx 축소를 전망하는 곳 없음"}, {"date": "2026. 7. 6", "sortDate": "2026-07-06", "title": "소버린 AI와 프론티어 AI의 경쟁 속 네오클라우드의 역할은?", "core": "- 유동성 풍향계 역할(금,비트코인) : 단기 유동성 삐걱삐걱 > But, 금과 비트코인 흐름을 보니 유동성이 완화되는 조짐(그저 예상)\n\n- 요새 AI 산업계의 구도 : 기득권을 위협하는 자 vs  기존에 기득권을 쥐고 있던 자, 또는 생존을 위협받는 자 = 오픈AI, 앤트로픽, 메모리회사 vs 빅테크 + 소프트웨어 기업\n\n- 오픈소스 모델을 돌리려면 자체 하드웨어에 막대한 투자금을 지출해야 하는데,\n메모리와 CPU, GPU가 점점 비싸지는 요즘 CapEx에 투자할 수 있는 여력이 있는 기업이나 정부만 사용 가능할테니까요.\n반대로 프론티어 모델을 위주로 사용하는 사용자는\n자본투자 없이 구독형으로 편리하게 사용할 수 있지만, 프론티어 랩들이 요금을 올리면 거기에 꼼짝없이 묶인다는 단점이 있습니다.\n>> 서버는 네오클라우드를 통해 임대하고, 라우터를 통해 오픈소스 모델과 프론티어 모델을 동시에 쓰는 일종의 하이브리드 형태가 되지 않을까 \n\n- 저번주 소프트뱅크가 SB Neo 라는 네오클라우드 회사를 세우고 AI를 중심으로 제2의 창업을 한다는 선언\n>> 네오클라우드 섹터의 매력도가 올라가는 조짐!"}, {"date": "2026. 7. 8", "sortDate": "2026-07-08", "title": "조정장 앞에 장사 없는 투자시장, 포트폴리오 전략은?", "core": "- 삼성전자는 사실상 106조 원의 분기 영업이익을 기록 (지난 3년간 합산 영업이익을 한 분기만에) > 한동안 세계 영업이익 1위 자리를 차지할 확률이 높음\n> 실적과 별개로 시장 분위기는 좋지 않음 > 이에 [팔란티어 vs 프론티어] 헷지 수단으로 '팔란티어'에게 자금이 수급중 (9~10% 상승중)\n\n- 개별 기업들 자체칩 개발 속도 < 엔비디아 매출 확대 속도"}, {"date": "2026. 7. 10", "sortDate": "2026-07-10", "title": "오픈소스 대신 폐쇄형 프론티어 진영에 합류한 메타", "core": "- X에서 활동을 하지 않던 마크 저커버그가 2012년 1월에 한 번, 2023년 7월에 한 번 포스팅한 이후 3년만에 활동을 재개 > '스레드'의 경쟁자 'X'에서 활동 > 'Muse Spark' 홍보\n> 그만큼 칼을 갈고 등장 (Opus와 GPT 5.5 정도와 견줄 정도) > 프론티어 모델 경쟁 순위 탑3가 앤스로픽, 오픈AI, 구글에서 앤스로픽, 오픈AI, 메타로 바뀐 모양새 \n>> 메타가 Llama와 같은 오픈소스 모델을 출시하던 예전과 다르게 폐쇄형 유료 프론티어 모델을 개발하는 쪽으로 선회\n> 프론티어 회사들에 대한 회의론 중 하나가 시간이 지날수록 AI 모델의 성능은 비슷비슷해지고 범용화/상품화(commoditize)될 것이다! 라는 우려\n>> 하지만 마크 저커버그는 스스로 프론티어 모델 역량을 보유해야 생존한다는 쪽으로 생각을 바꾼 모양\n\n- 중국은 미국 Fable 통제 조치처럼 중국 AI 모델에 대한 해외 접근을 제한하는 방안을 검토 (폐쇄형 프론티어 모델, 개방형 오픈소스 모델 모두 포함)\n> 소버린 AI 개발 경쟁이 촉발될 수 있는 뉴스임과 동시에, 오픈소스라고 해서 모두에게 공개될 거라는 생각은 버리게 하는 뉴스\n> 오픈소스 모델은 중국 모델이 가성비가 좋기 때문에 미국 스타트업들도 거의 대부분 중국 모델을 쓰는 중\n> 이 조치가 시행되면 이런 스타트업들의 비용이 급증하거나 서비스 중단 행렬 가능성 높음 > 이런 와중에 메타는 가격 경쟁력을 내세운 새 모델을 발표 (절묘한 타이밍) \n> 메타는 차세대 모델 개발에 2026년 7GW 연산력 추가까지 오히려 풀악셀을 밟을 분위기\n\n- Raise Summit 요약 (루머이기 때문에 참고만)\n> 마이크로소프트 대상 Horizon 1 인도가 7월 19일로 정해졌고, 다행히 마이크로소프트는 운영에 거의 개입하지 않을 정도로 만족\n> 데이터센터 투자 수요가 점점 강해지고 있다보니 계약 조건도 유리해지고 있고, \n> 선지급금도 25~40% 또는 100%까지 제안하는 고객도 있다\n> 또 아이렌의 GB300 클라우드가 얼마전 HGX B300에 이어 엔비디아 Exemplar Cloud 인증을 획득"}, {"date": "2026. 7. 12", "sortDate": "2026-07-12", "title": "AI 버블론을 노이즈로 보는 이유", "core": "- 샘 알트먼과 일론 머스크의 소송전이 머스크의 완패 > '오픈AI의 5.6 Sol 성능이 세계 최고라는 가장 큰 지표는 일론 머스크가 다시 내 욕을 하기 시작한 것’이라며 홍보\n> 토큰 가격만 낮춘 게 아니라 추론 효율을 높였다는 게 포인트 > 더 낮은 추론 원가로 더 많은/고급 토큰을 만들어낼 수 있음 > 프론티어 랩의 마진율이 더 좋아질 수 있음\n\n- 프론티어 AI 회사의 영업이익 = (토큰 판매 가격 - 추론 원가) X 사용량 - (모델 학습비 + 고정비 등)\n> 여기서 단순히 AI 모델의 가격 경쟁만 심해지면 판매 가격이 떨어지면서 이익이 줄어들지만, \n> 토큰 판매 가격이 떨어지는 것보다 추론 원가가 더 많이 떨어지고, 여기에 사용량까지 크게 증가하면 오히려 이익은 증가\n>> 오픈AI처럼 Sol, Terra, Luna 등 다양한 비용의 모델을 내놓으면서 토큰 효율 관점에서 여러 옵션을 제공하는 게 트렌드가 될 것 같습니다.\n\n- AI 트렌드는 토큰을 최대한 많이 쓰는 tokenmaxxing에서 최대한 가성비 있게 쓰는 valuemaxxing으로 변하고 있는데요."}, {"date": "2026. 7. 14", "sortDate": "2026-07-14", "title": "이란의 암살 계획에 폭격으로 답한 트럼프, 현재 시장의 가장 불안한 지표는?", "core": "- 이스라엘의 첩보로 이란이 트럼프의 암살을 계획 > 미국이 이란에 대대적인 공습을 퍼붓고 호르무즈해협 역봉쇄를 재개\n> 이제 트럼프 암살 정도는 띄워줘야 유가에 영향\n*미국이 처음으로 Saronic의 무인(자폭) 수상드론을 활용해 공격한 사례도 포착 (미국도 슬슬 AI 무인기와 드론을 전투에 활용)\n\n- 연준 이사 크리스토퍼 월러 : 물가를 관세 탓으로 돌릴 수 있는 시점은 이제 지났고 이번주 CPI가 생각보다 강하게 나오면 금리 인상을 선택지에 올려야 한다\n> 지금까지 했던 언급 중 가장 강한 어조로 인상 가능성 \n- (2인자) 뉴욕 연준 총재인 윌리엄스 : 근원 인플레이션이 월평균 0.2%만 안 넘으면 지금 금리가 적절한 위치에 있다\n> 근원 CPI가 월평균 0.2% 이상으로 넘으면 금리 인상으로 돌아설 수 있음\n\n- 5월 이후 거의 최고 수준에 가까운 10년물 금리가 더 거슬리는 상황 > 10년물 금리가 높아지면 높아질수록 주식 시장의 매력도가 함께 낮아짐\n*미국의 10년물 금리 : 자본시장에서 증시 수익률과 주로 경쟁하는 포지션 and 사실상 주식 밸류에이션의 할인율 (특히 먼 미래의 이익을 반영하는 섹터일수록)\n>> 돈을 많이 빌려야 하는(차입비용 상승) AI를 포함해  우주, 양자 등 장기적인 미래를 반영하는 섹터가 현재 채권금리 상승의 부정적인 압력을 받는 모양새\n>>> 10년물 금리가 미국이 개입해 대응할 만한 심리적 상단에 거의 근접 >>> 조정이 매력적인 구간에 진입했다고 생각 (10년물 금리 모니터링 필요 !)\n\n- 메타가 연산력 확충을 줄이는 게 아니라 오히려 가속화 > '메타, 건설중 데이터센터 2.5배 확장' (https://www.hankyung.com/article/202607132800i)"}, {"date": "2026. 7. 15", "sortDate": "2026-07-15", "title": "미국 주식 토큰화는 어떻게 진행되고 있을까?", "core": "- 미국 예탁결제원(DTCC)에서 주식을 블록체인으로 토큰화하는 실물 거래 테스트를 진행\n> 주식을 예치해두고  블록체인 상에서 주식을 이동할 수 있게 해주는 스테이블코인의 주식 버전이라고 생각\n> 시연 대상 : (미국 시가총액 상위기업 지수인) 러셀 1000 지수에 포함된 주식들과 ETF, 미국 단기/중기/장기국채가 포함\n>> 블록체인의 엄청난 성장을 기대?! >> But, 미국 주식 시장 거래의 처리는 주식 거래를 하나하나 다 결제하는 게 아니라\n서로 반대로 겹치는 98%의 거래들을  하루가 끝날 때마다 상계해버리고 남은 2%만 실제로 처리하는 방식\n>> 블록체인은 이런 요령 없이 거래 하나하나마다 다 기록하고 노드들의 합의를 거치는 과정이 필요하기 때문에 거래에 따르는 비용이 많이 듭니다.\n>> 기존 주식 시장을 보완하는 정도\n-> 실제 주식 증권을 빌려주거나 담보로 활용할 때 블록체인을 활용\n-> 증권을 담보로 연계 토큰을 만들어서 야간/주말까지 365일 24시간 주식을 거래하는 효과를 낼 수 있도록 활용하는 등\n>>> 개미 투자자들이 이득을 보기보다는 제인스트리트 같은 공매도 잘하는 퀀트 회사들이 한탕 해먹을(?) 거리가 더 많아질 것 같기도 하네요.\n>>> 10월 즈음 서비스 정식 출시 : 코인 및 토큰화 관련 주식들(로빈후드, 코인베이스, 써클)이 내러티브를 탈 가능성도 있다는 걸 염두"}, {"date": "2026. 7. 16", "sortDate": "2026-07-16", "title": "금리를 인상한 한국은행, 여전히 미국 연준만 바라보는 투자자들", "core": "- 한국은행 기준 금리 인상 (2.5% > 2.75%) > 이에 더불어 국내 투자시장 분위기 암울 > 다들 미 연준만 바라보는 중 (?)\n\n- 뉴욕주지사가 미국 처음으로 50MW 이상 대형 데이터센터 허가를 1년 보류하는 행정명령을 서명 (신규 허가 대상, 기존 뉴욕 소재 데이터센터 133개는 예정대로 진행)\n> 트럼프 왈 : 데이터센터는 ‘미래의 일자리를 이끌 가장 큰 원동력 중 하나고, 크고, 강력하고, 대담한 투자이자 막대한 돈을 벌어다주는 돈 버는 기계(Money Machines)’\n> 데이터센터가 중간선거의 핫한 주제로 떠오를 것 같은 예감\n\n- 데미스 하사비스 발언 (내용을 과장하거나 타임라인을 짧게 잡는 사람이 아님)\n> AGI(범용인공지능)이 완성되기까지 몇 년밖에 안 남았다.\n> 인터넷, 모바일보다는 불이나 전기에 가까운 파급력이다.\n> 전례가 없는 규모/속도라, 닷컴버블과 같은 과거와의 비교는 아무런 의미 없다.\n> 프론티어 모델에서 나올 수 있는 위험은 아주 크다.\n> 요즘 경쟁이 너무 센 분위기라 위험에 대한 이해도 대비 개발 속도가 너무 빠르다.\n> 전세계 단위의 프론티어 인증/규제 기구가 필요하다.\n> 다 같이 합의해 발전 속도를 늦추는 것도 옵션."}, {"date": "26/7/16(LIVE)", "sortDate": "2026-07-16", "title": "조정장에서 바라봐야 하는 것", "core": "📌 NeoCloud\n현재 네오클라우드 섹터는 AI 투자 수익성에 대한 시장의 의심으로 조정을 받고 있지만, AI 인프라 투자는 여전히 견고하게 이어질 것으로 전망된다. 빅테크는 투자 속도를 조절할 수는 있어도 CapEx 자체를 크게 줄일 가능성은 낮으며, AI 클라우드 기업들의 본격적인 매출과 자유현금흐름(FCF) 개선은 올해 말부터 내년 사이에 점차 확인될 것으로 예상된다. 따라서 현재의 변동성은 수익성이 증명되기 전까지 이어질 수 있지만, 오히려 장기 투자자에게는 비중을 확대할 수 있는 구간으로 평가된다.\n\n📌 양자\n양자 산업은 미국과 중국을 중심으로 방산과 소버린 AI 전략의 핵심 기술로 부각되며 정부 투자가 본격적으로 확대되고 있다. 특히 인플렉션은 양자컴퓨터보다 상용화가 빠른 양자센서 사업을 통해 이미 군수 분야 매출을 발생시키고 있다는 점이 강점으로 평가된다. 향후 2~3년을 바라보는 장기 투자 관점에서 양자 섹터는 다음 성장 사이클의 유력한 후보로 제시되며, 현재의 가격 조정 구간은 장기적인 매수 기회로 해석된다.\n\n📌 반도체·매크로\nTSMC는 시장 예상치를 뛰어넘는 실적을 발표했지만, 2nm 공정과 미국 공장 투자 비용으로 인해 다음 분기 가이던스를 다소 보수적으로 제시했다. 반면 ASML은 EUV 장비 독점과 제한적인 생산 능력으로 인해 반도체 공급 부족이 2027~2030년까지 이어질 가능성이 높다고 전망된다. 한편 시장 전반은 레버리지 청산 과정이 진행 중이지만 금융주의 실적은 견조해 금융 시스템 리스크는 제한적으로 평가되며, 향후 시장의 핵심 변수는 FOMC의 금리 방향성과 빅테크의 AI 투자 지속 여부가 될 것으로 보인다."}, {"date": "2026. 7. 17", "sortDate": "2026-07-17", "title": "욕 나오는 시장, 언제 적응될까?", "core": "폭풍이 지나가고 나면, \n\n그 폭풍을 어떻게 견디고 살아남았는지 기억조차 못 할 것이다. \n\n사실 폭풍이 정말 끝났는지조차 확신할 수 없을 것이다. \n\n하지만 한 가지는 확실하다. \n\n폭풍을 겪기 전과 후의 당신은 같은 사람이 아니라는 사실이다. \n\n그게 바로 폭풍이다."}, {"date": "2026. 7. 19", "sortDate": "2026-07-19", "title": "제2의 딥시크'라 불리는 Kimi K3 출현, 하락장 현금 활용 전략은?", "core": "- 중국의 AI 유망주인 문샷AI에서 새로운 오픈소스 모델 Kimi K3을 공개 > 일부 성능 지표에서 미국 프론티어 랩의 프론티어 모델에 준하거나 앞선 성능을 보여줘서 큰 논란\n> Kimi의 K3 모델의 스펙 : 파라미터 수는 2.8조 개, 컨텍스트 크기는 100만 토큰\n* '파라미터'란 신경망에 있는 가중치들의 합 : 실선 개수(가중치 파라미터) + 맨 왼쪽 입력 노드 4개를 제외한 노드 수(편향 파라미터) = 가중치 개수\n** '컨텍스트' 크기란 AI 모델이 한 번에 기억하는 임시 작업 공간의 크기\n** 파라미터가 언어 능력, 코딩 패턴, 일반적인 상식 등 장기적으로 학습된 능력이라면, 컨텍스트는 AI한테 요청한 프롬프트 텍스트, 질문할 때 올린 사진 및 PDF 파일 등\n>> K3 모델의 흥미로운 점은 성능도 프론티어 모델 급으로 따라왔지만, '추론 비용'도 프론티어 모델 급으로 올라왔다는 점\n>> 그동안 오픈소스 모델은 파라미터 사이즈가 작은 만큼 추론 비용도 훨씬 저렴한 게 주요 장점 중 하나였는데,\nKimi와 같이 프론티어에 가까운 오픈소스 모델은 더 이상 추론이 저렴하지 않고, 오히려 성능 향상에 비해 토큰 효율성 발달은 떨어지는 모습\n>>> (오픈AI와 앤스로픽의 모델을 대체할 정도로 성능이 안정되진 못하고 토큰 효율성도 아직 좀 떨어지지만) 그래도 지표상으로라도 미국 프론티어 랩을 따라올 수 있다는 게 대단한 일\n\n- 반도체와 인프라의 지속적인 수요는 사실상 AI의 Scaling 법칙에 근간 > Kimi를 출시한 문샷AI도 직원들도 자신들이 어쩌면 오픈AI보다 Scaling 법칙을 더 신봉한다고 밝힘\n> 특히 추론 토큰 효율성이 나아지지 않았기 때문에 추론을 위한 데이터센터/GPU/메모리 등 연산 인프라 수요는 중국과 미국 모두 더 커질 수밖에 없는 상황\n> 학습이 효율적으로 이뤄진다고 해도 어차피 반도체와 인프라 수요는 학습보다 추론이 중심"}, {"date": "2026. 7. 21", "sortDate": "2026-07-21", "title": "불안하지만 '해치웠나…?' 하는 생각이 들게 하는 시장 (ft. IREN)", "core": "- 유동성의 영향을 많이 받는 비트코인 시장은 생각보다 안정적\n> 공급 이슈인 반감기 사이클에 따라 2024년 반감기 이후 2025년 정점을 찍고 힘을 잃는 모양새\n> 2012년 반감기 - 2013년 정점 / 2016년 반감기 - 2017년 정점 / 2020년 반감기 - 2021년 정점 / 2024년 반감기 - 2025년 정점\n>> 정점 이후 1년이 되어가는 요즘은(정확히는 올해 10월 즈음) 한 번 더 하락이 있더라도 버텨볼만한 구간에 도달했다고 생각\n\n- IREN 발표\n> 연간반복매출(ARR) 목표를 기존 $3.7B에서 $4.0B 이상으로 상향 (계약이 안나오는 동안 연산 인프라 가격이 올라서)\n*아마 연말 즈음 $4.3~$4.4B 까지도 더 올라갈 수 있다고 기대\n** 올해 480MW은 내년에 1210MW로 올라가고 새롭게 추가되는 730MW는 더 좋은 GPU로 더 비싼 값에 계약될 가능성이 높음\n(올해 ARR 목표인 $4.0B는 내년 $13~15B 정도로 올라가지 않을까 기대)\n> 빅테크에 인프라만 제공하는 게 아니라 중소규모의 AI 기업들에게 직접 서비스를 제공\n> 고객 목록 중, ‘이름을 공개하지 않은 새로운 선도(leading) AI 개발사’가 있다는 건데, 프론티어 랩이나 빅테크 정도의 체급이지 않을까 생각\n> 고객이 GPU 설비 투자(CapEx)의 약 45%를 선지급하는 조건의 계약\n> 2026년 6월 30일 기준 아이렌의 현금 및 현금성 자산은 $7.6B (발표하기 전 시가총액이 겨우 $12B)\n\n- 앤스로픽이 피지컬인텔리전스(PI) 인수를 준비한다는 루머\n> 구글도 제미나이와 로봇을 연결하는 부서가 있고 오픈AI도 내부 로보틱스 팀이 있는 데 반해 앤스로픽은 코딩 분야에만 집중하는 상황\n> 슬슬 프론티어 랩들의 피지컬 AI 경쟁이 물밑에서 조금씩 진행되는 모양"}, {"date": "2026. 7. 22", "sortDate": "2026-07-22", "title": "오라클에 대한 걱정은 언제쯤 끝날까? (ft. NVIDIA)", "core": "- AI 기술주 시장 반등, But 안심하기에는 아직..!\n> 미국이 11일째 이란을 폭격하고 있어 유가도 오르고, 10년물 금리도 떨어지지 않고 전고점 상단 부근\n> 이번엔 트럼프가 휴전 협상보다 계속 폭격을 이어가길 원하고 있어서, 미국이 주도권을 쥐고 있는 모양새라 오히려 휴전합의 때보다는 전쟁 불안이 덜해보임\n>> 빅테크 실적발표와 월말 연준 FOMC가 나와줘야 3분기 시장 방향성이 어느 정도 잡히지 않을까 싶네요.\n>>> 11월 중간선거 이전에는 주가를 부양해야 함 > ‘세상의 미래는 세상을 움직이는 강력한 사람들이 원하는 쪽으로 흘러간다’고 생각\n*미국 대부분 유권자들과 퇴직연금의 부는 주식으로 보유 중\n\n- 다시 나오는 관세 이야기\n> 관세 위헌 판결 이후 트럼프가 쓸 수 있던 무역법 122조 카드는 150일짜리라 7월 24일에 만료\n> 원래 없던 관세가 생긴다기보다는 이번주 만료될 기존 관세를 연장하는 성격이라 큰 파장은 없으리라 기대\n\n- 엔비디아는 차세대 시스템인 베라루빈(Vera Rubin)의 본격 공급을 시작\n> 마이크로소프트, 코어위브 등 인프라 사업자들과 오픈AI, 앤스로픽, 스페이스X 등 프론티어 랩들에게  테스트용 랙을 전달\n*베라루빈 랙 하나의 가격은 7~800만 달러or100억원으로, 이전 세대 블랙웰 랙의 가격인 4~500만 달러or66억원보다 훨씬 비싸짐\n** 가격 상승의 이유는 Memory 가격의 상승이 주요\n** 엔비디아 엔지니어링 담당 수석부사장인 앤드루 벨 : VERA Rubin 하루에 최대 1,000대의 랙을 생산 (단순 계산해보면 분기당 무려 6,300억 달러의 매출, 전분기 매출 816억달러)\n> 코어위브가 테스트한 데이터를 보면 베라 루빈 랙이 이전 세대인 그레이스 블랙웰 랙보다 MW당 처리량이 10배 높았음\n*전력이 가장 희소한 자원인 요즘 베라 루빈을 도입하지 않을 이유가 없음\n\n- 오라클 CDS(신용부도스왑)의 프리미엄이 최대치(2.07%)\n*CDS(신용부도스왑) : 간단히, A라는 회사에 100억 투자 - 이에 보험으로 B은행에 보험상품을 가입 - A회사에게서 못받는 돈(지급불능)에 대해 B은행이 보상 \n**CDS Premium : A회사가 망할 조짐이 보일 경우, B은행에서 보험료인 CDS Premium을 올림\n> 오라클이 짓고 있는 데이터센터 전력망을 블룸에너지 연료전지로 바꾸면서 기존보다 상당한 비용 초과가 발생\n> 오라클 창업자 래리 엘리슨의 아들이 운영하는 파라마운트 스카이댄스가 미디어 업계의 LVMH라 불리는 워너브라더스를 인수하려고 하는 중\n> 넷플릭스와의 인수 경쟁에서 이기기 위해 래리 엘리슨이 개인 보증까지 서둔 상태\n>> 오너가 틱톡 인수나 워너브라더스 인수를 무리해서 진행하고 있는 게 부담이 되는 변수\n\n## 오라클의 부도설(?)이 네오클라우드 섹터에 영향을 주는가?\n: 오라클의 주가 부진이 AI 클라우드 섹터 전체에 대한 부담을 주긴 하겠지만 네오클라우드 회사마다 노출도가 조금씩 다름\n### 네오클라우드 3대장\n- 코어위브 : 가장 큰 매출과 이익 / 높은 부채 비율 / 클라우드 공급 계약을 바탕으로 레버리지를 많이 일으켜 최대 속도로 몸집을 키우는 전략\n- 네비우스 : 원래 얀덱스 매각 이후 부채 없이 현금보유 / 코어위브를 따라 잡고 네오클라우드 시총 1위를 달릴 수 있는 이유 / 전환사채를 중심\n- 아이렌 : 부채비율을 준수하게 만들기 위해 유상증자를 많이 활용 / ATM으로 실시간으로 지분 희석\n*주주 입장에서는 가능하다면 나중에 주가가 오른 후 때려맞는 네비우스 방식이 훨씬 친화적\n> 네비우스/아이렌도 코어위브를 따라 부채 비율이 점점 높아질 가능성은 있음"}, {"date": "2026. 7. 23", "sortDate": "2026-07-23", "title": "구글 실적발표, AI 내러티브를 이어주는 희생타?", "core": "- 구글 실적발표 요약 : CapEx는 줄이지 않는다. 오히려 늘렸고, 이에 구글 주주들은 자본지출 증가로 (-3%) 하락\n> FCF(Free Cash Flow 잉여현금흐름) : 이번 분기에 처음으로 마이너스. 빠르게 현금을 소진 중\n*구글을 따라 다른 빅테크들의 잉여 현금흐름도 올해 하반기 중에 마이너스로 돌아설 확률이 높을 것\n> 구글의 메인 사업 검색 매출은, AI로 인해 오히려 증가 중\n> 클라우드 매출 : 247.7억 달러(Est 224.6억달러). 전년대비 82% 증가\n> 클라우드 영업이익 : 88.1억 달러 (212%증가)\n> 클라우드 마진율 : 35.6% (Est 30.8%)\n>> 비싸게 만들어서 팔아도 다 팔리는, 수요가 아주 강한 상황이라는 뜻\n> 이번 분기 클라우드 매출이 247.7억 달러인데 예약된 수주 잔고는 5,140억 달러($514B)\n* 주당순이익은 $9.11로 갑자기 예상치보다 3배나 높게 나왔는데, 이중 대부분은 영업활동으로 번 게 아니라 스페이스X를 포함한 지분투자 평가이익에서 나옴\n평가이익을 모두 뺀 주당순이익은 $2.85라서 평소의 평가이익 수준으로 줄인다고 생각하면 전망치인 $2.91에 부합하는 수준\n\n## 구글(왈) :\nAI 시장은 여전히 초기 단계에 있으며, 구글 내부 + 구글 고객들 모두 수요가 강력하지만 이를 만족시킬 공급은 턱없이 부족\n내외부, 장단기 수요를 만족시키기 위해 AI 연산 인프라 투자에 공격적으로 나서는 와중, 내부 역량을 확충하는 동안의 가교 전략으로 3분기에는 제3자(외부) 용량 활용을 확대할 계획"}, {"date": "26/7/23(LIVE)", "sortDate": "2026-07-23", "title": "중간선거와 시장", "core": "- 미국, 중간선거\n현재 공화당은 상·하원에서 우세하지만 하원의 의석 차이가 크지 않아, 중간선거에서는 민주당이 하원을 탈환하고 공화당이 상원을 유지할 가능성이 높다. AI 데이터센터와 관련 정책이 정치적 쟁점으로 부상하면서 이번 선거에서도 AI가 주요 논의 대상이 될 전망이다.\n미·중 AI 경쟁과 반도체 수출 통제는 초당적 사안인 반면, AI 데이터센터의 전기요금·용수·환경 문제는 양당 간 대립 이슈가 될 가능성이 크다. 미국인의 자산이 주식시장에 많이 연계돼 있어 증시 성과가 선거에 영향을 주며, 증시를 주도하는 AI 산업도 정치적으로 중요해지고 있다.\n선거 이후 공화당이 상원을 유지하고 민주당이 하원을 장악하면, 빅테크 견제와 청문회·예산 감독이 강화되고 정부 셧다운 위험도 커질 수 있다. 다만 국가안보처럼 초당적 합의가 가능한 정책은 유지될 가능성이 높으며, 중간선거가 전체 투자 내러티브를 결정하는 절대적 변수는 아니다.\n민주당이 하원을 장악하면 빅테크와 프런티어 AI 기업을 대상으로 환경, 전기요금, 일자리 대체 문제 등에 관한 청문회가 늘어날 수 있다. 반독점 정책 강화는 SpaceX의 독점을 견제하는 동시에 Rocket Lab 등 경쟁 우주기업에 간접적인 기회가 될 가능성도 있다.\n\n미·중 AI 경쟁 심화와 오픈소스 모델 도용 논란\n모델 답변의 표현과 뉘앙스를 비교하는 평가에서 Kimi K3가 Fable과 매우 높은 유사성을 보였고, 일부 중국 모델도 미국 모델과 비슷한 답변 패턴을 나타냈다는 분석이 제기됐다. 이는 직접적인 도용 증거라기보다는 다른 모델의 결과물을 활용해 증류했을 가능성을 의심하게 만드는 정황이다.\n중국 AI 기업들은 모델을 오픈소스로 공개해 전 세계 개발자들의 테스트와 개선 참여를 끌어내고, 부족한 기술력을 빠르게 보완하려 한다. 또한 DeepSeek이나 Kimi처럼 인지도가 낮은 기업에는 무료 공개가 이용자를 확보하고 브랜드를 알리는 마케팅 수단으로 활용된다.\n\n중국 AI 현황\n중국은 미국 주요 빅테크들과 비교해 GPU와 데이터센터 인프라가 크게 부족하기 때문에 자체 유료 AI 서비스를 대규모로 운영하기 어렵다는 평가를 받는다. 이에 중국 기업들은 모델을 오픈소스로 배포하고, Together AI나 네오클라우드 사업자들이 해당 모델을 대신 운영해 서비스와 수익화를 담당하는 구조를 활용하고 있다.\n\n현재 AI 시장\n과거 미국 AI 모델이 시장의 대부분을 차지했지만 최근에는 DeepSeek, Kimi, MiniMax 등 중국 오픈소스 모델의 사용 비중이 빠르게 증가하고 있다. 이 때문에 중국이 모델 공개를 중단하거나 통제할 경우 해당 모델에 의존하는 기업들이 운영상 큰 위험에 노출될 수 있다.\n오픈소스 모델은 공개된 가중치를 사용할 수 있어도 학습 데이터와 개발 과정 전체를 확인하기 어려워, 보안 취약점이나 정치적 편향이 포함될 가능성을 완전히 배제하기 어렵다. 미국은 중국 모델에 대한 의존도를 줄이고 안보 위험을 관리하기 위해 자국산 오픈소스 AI 생태계를 적극 지원할 필요성이 커지고 있다.\n\n데이터센터 동향\n하이퍼스케일러와 네오클라우드의 AI 매출은 지난해부터 감가상각비를 넘어섰으며, 그 격차도 점차 확대되고 있다. 아직 감가상각비가 매출의 약 70%를 차지하지만, 향후 운영 효율이 개선되면서 OpEx를 포함한 수익성도 지속적으로 좋아질 가능성이 있다. Hopper GPU는 시간이 지나 감가상각이 끝나면 비용 부담이 크게 줄어 매출 기여도가 더욱 높아질 수 있다. 기존 GPU 자산이 계속 활용된다면 높은 현금창출력을 갖는 자산으로 전환될 가능성이 있다.\n하이퍼스케일러의 자체 데이터센터는 대부분 2029~2030년 이후에야 본격 가동될 전망이다. 그 전까지는 AI 인프라 공백을 메우는 역할을 네오클라우드 기업들이 담당할 가능성이 크다.\n\n데이터센터 변수\n데이터센터 건설에서는 전력 용량뿐 아니라 전기요금 영향, 물 사용량, 냉각 방식, 지역사회 보상 등 ESG 요소가 핵심 변수로 떠오르고 있다. 이러한 조건을 충족하지 못하면 주민 반발과 환경단체 시위로 인해 프로젝트가 장기간 지연될 위험이 커지고 있다.\n\n양자\n구글은 AI를 활용해 양자컴퓨터의 오류를 실시간으로 보정하는 연구를 발표했으며, 이는 계산을 멈추지 않고도 오류를 줄일 가능성을 보여줬다. AI가 오류 패턴을 학습하면서 정확도가 크게 향상됐고, 연구원의 보정과 AI 보정을 함께 적용했을 때 추가 개선 효과도 확인됐다.\n현재 양자컴퓨터는 운영체제가 없어 저수준 명령으로 직접 제어해야 하는 단계이며, 구글은 AI 기반 오류 보정을 통해 이를 자동화하는 기반을 구축하려 하고 있다. 장기적으로는 양자컴퓨터용 운영체제를 선점해, 과거 마이크로소프트가 Windows 생태계를 구축한 것과 같은 전략적 위치를 확보하려는 움직임으로 해석할 수 있다."}, {"date": "2026. 7. 24", "sortDate": "2026-07-24", "title": "생각보다 유가 상승을 잘 버티는 시장, 다음주 FOMC 때문?", "core": "- 미국채 10년물 금리 고점 (4.7%)\n> 호르무즈 봉쇄가 다시 길어질 것 같으니까 유가가 상승\n> 유가가 튀니까 물가 상승 우려가 심해지고\n> 물가 상승 우려가 곧 금리 인상 우려\n> 금리 인상 우려가 국채 매도로 이어지면서\n>> 국채 금리가 상승\n>> 시장의 초점이 유가와 채권금리로 옮겨갔다는 거 자체가 AI CapEx가 줄어들지 말지에 대한 불확실성은 구글과 인텔 실적발표 이후 상당부분 해소된 게 아닌가 싶습니다.\n\n- 인텔 실적 : 전망치를 크게 뛰어넘으면서 좋게 나옴 > 미국의 소버린 반도체 파운드리 !\n> 매출 : 161억달러 (Est 144억 달러, 12%업)\n> EPS : 0.42달러 (Est 0.22달러, 91%업)\n> 3분기 가이던스 : 158~168억달러 (Avg Est 151억 달러)\n> CapEx : $18B -> $20B\n\n어차피 지금 시장에서 뭔가 읽어보려고 해봤자 다음주에 있을 굵직한 빅테크 실적발표와 연준 FOMC가 지나면 분위기가 싹 바뀔 수 있는 구간"}, {"date": "2026. 7. 27", "sortDate": "2026-07-27", "title": "미국 국채금리 상승의 숨은 주범 (ft. 한국의 아이렌?)", "core": "- 중국의 대표적인 DRAM 반도체 기업인 창신메모리(CXMT)가 상장\n> 첫날 공모가 대비 +470%로 시작하면서 중국 본토 기준 시가총액 1위\n> 올해 흑자전환해 1분기에만 330억 위안의 이익 (한화로 7조원)\n> DRAM 글로벌 점유율 : 삼성전자 38% , SK하이닉스 29% , 마이크론 22% , CXMT 8%(4위) \n> 지난 6월에는 CXMT가 화웨이의 가격 할인 요청을 안 들어줘서 화웨이와 한탕 싸웠다는 로이터 기사 > 중국 내에서도 메모리 부족이 계속\n\n- 미국 & 이란 공습 > 유가, 국채 금리 > 미국 채권시장의 쏠림 현상\n> 공습을 중단 > 유가는 잠시 안정 / 국채금리도 (살짝) 내려가긴 했는데, 국채금리는 유가가 안정된 만큼 내려가지는 않는 중\n> 분명히 유가가 국채금리에 영향을 주긴 하지만, 유가 외에도 국채금리에 상방 압력을 주는 일들이 많다\n>> 원인 중 하나, 채권시장 자체의 부담\n: 요즘은 AI 인프라 구축에 필요한 자금을 마련하기 위해 네오클라우드와 빅테크까지 채권시장 > 원래라면 미국채에 들어갔을 자금의 일부가 AI 관련 채권에 들어가고 있는 상황\n> (골드만삭스 금융 책임자)존 그린우드의 인터뷰 : 지금까지 채권 시장은 AI 채권에 아주 우호적 > but 수요가 빠르게 몰리면서 물량 소화에 부담\n(* 회사채 경쟁 : 엔비디아가 250억 달러 회사채  > 스페이스X도 250억 달러 > 바로 이어서 아마존이 또 250억 달러 채권을 발행)\n>> 역으로, 'AI 프로젝트의 신용도가 낮고 위험하다고 판단해서'라기보다는 '시장 유동 자금에 비해 단기간에 너무 많은 자금 수요가 몰려서' 생긴 수급 이슈 !\n\n- SK텔레콤은 데이터센터 건설을 위해 SK하이퍼라는 100% 자회사\n> SK하이닉스의 압도적인 현금 창출력을 활용 > 한국의 첫 네오클라우드 회사\n\n- 네오 클라우드 3대장의 현상황\n> 코어위브 : 미리 부채를 많이 땡겨둔 상태\n> 네비우스 : 앞으로 많이 땡겨야 하긴 하지만 그래도 엔비디아 후광으로 좋은 조건을 잘 받아오는 중\n> 아이렌 :  10조원 정도 현금을 쟁여두고 유상증자를 활용할 수 있는 ATM 한도도 많이 열어둔 상태\n>> 자금 준비는 무난할 듯 > 실제로 데이터센터를 건설할 건설 인력이나 장비 기술자를 확보할 수 있는가, 즉 사람이 더 큰 병목인 상황"}, {"date": "2026. 7. 28", "sortDate": "2026-07-28", "title": "AI 오픈소스, 하락의 원흉이 아니라 상승의 열쇠일지도?", "core": "- 계속 되는 하락에 하락 \n> 하락에 대한 이유로 꼽히는 것 : 실질적인 영향력에 비해 공포가 과도하거나 (중국 DUV 논란 등) / 1년 전부터 우려먹던 내용(순환출자 논란 등)이 많아서\n>> 이런 시장에서 하락의 원인을 분석하는 의미는 별로 없음 > 가격 하락이 먼저고 하락 내러티브가 거기에 따라붙는 시장에서는 어떤 이유로든 핑계를 붙여 떨어뜨리니까요.\n\n- 지금이 AI 투자 논리가 훼손된 게 아니라면, 훼손되는지 여부를 보려면 뭘 보아야 하느냐?\n(*전제 : 인프라 투자의 스케일 격차가 곧 AI 모델의 성능 격차로 이어지는 'Scaling 법칙'이 계속 건재하다)\na. 결국 돈이 나와야 하는 구멍인 전세계 소비자들이 AI 모델 판매에 돈을 계속 써줄거냐?\n> 네오클라우드들은 꼭 프론티어 모델에만 의존하지 않아도, 프론티어 모델이든 오픈소스 모델이든 높은 마진율로 소비자들에게 팔 수 있기만 하면 됩니다.\n> Kimi 3도 벌써 네비우스 토큰팩토리와 아이렌의 고객인 Fireworks AI, TogetherAI를 통해 판매\n>> 소프론티어 모델에 쓰는 돈이 줄어도 그만큼 오픈소스 모델에 들어가는 돈이 늘면 되니까 프론티어 모델이 둔화될 걱정에만 너무 매몰될 필요 없다\nb. AI공장에 돈을 부은 만큼 CapEx의 수익률과 마진율이 나오느냐?\n> 네비우스 토큰팩토리와 Fireworks AI, Together AI 같은 회사들이 어떤 마진율로 얼마나 매출 성장을 이끌어내고 있는지 잘 보여주면 자연스럽게 해소될거라고 생각\n\n+) 시타델에서는 이번에 케빈워시가 금리를 인상할 수도 있다는 의견 \n(저번 물가 데이터에서 인플레이션이 잡히는 서프라이즈가 나오긴 했습니다만... ) >> 물가 데이터가 잘나왔는데, 보수적으로 하기 위해?"}, {"date": "2026. 7. 29", "sortDate": "2026-07-29", "title": "두근두근 연준 FOMC, 빅테크 실적발표 D-Day...", "core": "- FOMC와 빅테크 실적발표는 앞두고 시장의 감정은?\n> 현재 시장은 7월 아니면 9월에는 금리를 1회 인상하는 걸 반영중 (7월 보다는 9월로 예상중)\n\n- 금리 인상 vs 금리 동결\na. 금리 인상\n> 오히려 연준이 채권 시장의 우려를 존중하고 있다는 의미로 해석 > (시장에 잠깐의 충격) > 한동안 금리를 또 인상할 필요는 없겠다는 인식 > 시장에 안도감 \nb. 금리 동결\n> 금리를 동결하면 인상을 안했다는 안도감 vs '채권 시장의 우려를 존중 안한다!' 하면서 시장하락\n(*이미 시타델이 미리 이번에 깜짝 금리 인상 할수도 있다는 예측)\n>> 꼭 인상한다고 하락하는 것도 아니고 꼭 동결한다고 상승하는 것도 아니라는 뜻\n>> 케빈 워시가 어떤 톤으로 어떤 멘트를 던져 시장을 안정시켜주는지가 중요\n\n- SK하이닉스 실적발표 (시장 전망치에 부합하는 정도)\n> 매출 79.3조원(연간 +257%)\n> 영업이익 60.5조원(연간 +557%) > 역대 최대 실적 > 영업이익률은 76.3%로 마이크론 80.4%에 이어 세계 2위 수준\n\n## 정수형 전략\n> FOMC를 앞두고, 네오클라우드가 바로 이전 저점을 뚫어주면 '추가 매수 예정'\n> 이미 저점이라고 할만한 시장이 나온만큼 더 떨어지더라도, 충분히 좋은 기회"}, {"date": "2026. 7. 30", "sortDate": "2026-07-30", "title": "긴축은 시장에 아웃소싱하겠다는 연준, 높은 장기금리는 뉴 노멀?", "core": "- 7월 FOMC 결과\n> 연준 이사들은 만장일치로 금리 동결 투표 / 돌아가면서 투표하는 지역 연은 총재 3명은 반대표 (반대표 3명은 이사회가 아님, 존재감 낮음\n> 미국채 1년물과 2년물 등 단기채 금리는 급락 / 미국채 30년물 등 장기채 금리는 급등\n>> (연준의 금리에 가장 민감한) 단기채는 당장의 금리 인상 가능성을 낮췄고,\n>> (인플레이션 및 경제의 장기 불확실성을 많이 반영하는) 장기채는 기간 프리미엄을 더 많이 반영\n>>> 케빈워시[왈]\n: 연준이 기준금리로 시장에 개입하지 않겠다는 메시지를 계속해서 던져보니 시장이 합의한 장기 시장금리 상승이 긴축 역할을 대신하더라, 장기금리 상승? 사실 의도한 것이다.\n\n> 장기금리 상승에 긴축을 의존하면 장기금리에 영향을 많이 받는 위험자산의 매력도가 떨어짐\n>> 그 영향을 받아 FOMC 이후 기술주들이 일제히 하락한 것으로 해석\n>> 장기금리가 올라가면 기술주들이 올라간 금융비용 만큼의 추가 성장률을 뽑아내주는지가 가장 중요한 질문\n>> 한정수 : 장기금리가 상승하더라도 여전히 AI 수익성이 이를 상쇄할 정도로 가장 매력적이라고 보는 쪽\n>> 그동안 기업들 입장에서 지금까지는 AI 인프라 투자금을 채권으로 많이 조달했다면,\n시장 금리가 오르고 채권 시장의 매력이 떨어지면서 채권 대신 유상증자를 활용해 자금을 조달하는 흐름이 늘어나지 않을까 예상\n\n- Microsoft 실적 발표 \n> 매출 : 900억 달러 (YoY 18% 증가) > 시장 전망치를 3% 상회\n> 영업이익 : 406억 달러\n> 주당순이익 : $4.81(앤스로픽 투자 평가이익이 포함된 숫자) > 시장 전망치를 13% 상회\n> (AI 수익성 지표) 클라우드 사업부 :  Azure 클라우드 매출이 43% 증가 (Est 40%를 상회) > 처음으로 연간 매출 1,000억 달러를 넘어섬\n> 현금흐름과 성장성이 최고점을 찍고 있는데도 CapEx를 유지\n\n- Meta 실적 발표\n> 매출 : 608억 달러 (YoY 27% 상승) > 시장 전망치인 602.9억 달러 1% 소폭 상회\n> 주당순이익 : $6.18 > (Est $7.22보다 14% 하회) > (YoY -13%)\n(* Q&A : 법적 절차와 관련된 24억 달러의 비용과 5월 인력 감축과 관련한 11.8억 달러의 퇴직금 비용이 포함되면서 일회성 비용이 커짐)\n(** 임의 계산 시 : 일회성 비용을 제외하면 주당순이익은 전년 대비 -13%에서 +3%로 상승. 영업이익률도 37%, 영업이익도 전년 대비 9.4% 증가\n> 3분기 매출 가이던스 : 610억~640억 달러(중간값 625억달러) > 시장 전망치 632억 달러 > 시장이 주가 하락으로 반응할 수 있는 포인트\n> 연간 CapEx 전망을 $125B~$145B에서 $130B~$145B (하단만 상향) > CapEx 전망치에 대한 언급은 최대한 피하면서 올릴 수도 내릴 수도 유지할 수도 있다는 스탠스\n\n>> 구글과 달리 둘다 FCF(잉여현금흐름)이 마이너스로 전환되지 않음\n\n## 과잉 투자가 나오면 ?!\n마이크로소프트는 워낙 사업 영역이 넓어 자기네가 쓰겠다는 입장이고,\n메타는 남에게 팔아버릴수도 있지만 자기네가 써서 그 이상의 효율을 뽑을 자신감이 있다는 입장"}, {"date": "26/7/30(LIVE)", "sortDate": "2026-07-30", "title": "하락장에서 다시 배우는 투자의 본질", "core": "- 이번 하락에 대해\n> 내가 투자하고 있는 종목이지만, 변동성이 큰 IREN을 가격 추이를 보면서 시장의 반응을 참고한다.\n> 내러티브도 맞고, 펀더멘탈도 맞는데 > 사람이 너무 많이 몰리고, 레버리지가 쌓이면 > 하락과 연쇄청산에 취약하다.\n>> 레버리지 먼저 정리되어야 상승의 여지가 생김 !\n(* 현재 코인 시장이 부진하여 레버리지 투자자들이 국내 주식시장으로 많이 유입된 상태 > 만약 코인시장이 활성화되면 이런 투자자들이 빠지게 됨)\n\n- FOMC에 대해\n> 이사들 외에는 돌아가면서 투표를 하는데, 이번에 투표한 지역 연준인 댈러스 연준 인사들은 존재감이 거의 없는 인물들이라 큰 의미는 없다고 생각\n> 월러 이사나 다른 이사분들, 혹은 뉴욕 연은 총재 같은 분들이 반대표를 던졌다면 큰 무게감\n> 하지만 존재감이 없는 인물들이 반대표, 심지어 트럼프와 논쟁했던 리사 쿡 위원도 동결\n>> 지역 연준 외 내부 인사들은 금리 동결에 의견을 모은 것으로 느껴짐\n\n- AI 시장에 대한 우려? 이전에는 오픈AI나 앤스로픽 같은 프론티어 랩들이 수익을 내지 못하면 전체 AI 시장이 위협받는 구조\n> 이제는 프론티어 랩에 의존하지 않고도 오픈소스를 활용할 수 있는 시장으로 체질이 변화\n> 일부에서는 오픈AI와 앤스로픽이 수익을 내지 못할 수도 있다고 말하지만, 실제로는 이들 기업이 매우 뛰어난 실적을 기록하고 있다고 판단\n\n- 최태원 회장, SK하이닉스 3620주(공시 기준 50억원 이하) 매수 > 시장에 메시지 전달\n\n- 공포 탐욕 지수 : 7가지 지표를 통해 공포/탐욕 지수가 산정됨\n> 현재 34(Fear)로 추가 하락이 우려되긴 하지만\n>> Junk Bond Demand 항목만 Greed / 나머지는 Fear and Ex Fear > 공포/탐욕 지수를 Ex Fear로 봐도 무방\n> Junk Bond 수요가 높은 현상은 AI 시장이 정크본드 발행을 주로 하는 경향 때문인 것으로 보임 > 이는 AI 관련 수요가 견조하게 유지되고 있음을 시사\n(*정크본드가 무조건 '쓰레기'는 아니며, 네오클라우드, 코어위브, 네비우스, 아이렌 등과 같은 기업들의 채권도 거의 정크본드 수준에 해당)\n>> 정크본드 수요가 높다는 것은 국채 대비 스프레드(위험 프리미엄)이 1.3%에서 1.5%까지 올라갈 경우 높은 프리미엄을 제공하는 것\n>> 현재는 예상보다 위험 프리미엄을 많이 주지 않아도 된다는 의미 > 시장 분위기가 좋다고 해석될 수 있는 지표이며, 기업 부도 우려나 신용 리스크를 크게 생각하지 않고 있다는 뜻\n>>> 결과적으로 경기 침체 확률이 낮다고 볼 수 있는 지표로 활용\n+) 메타까지 광고 실적을 발표하였는데, 구글과 메타 같은 광고 회사의 실적이 좋다는 것은 경기 침체와는 다소 상반되는 결과라고 생각\n\n- 버블의 징조는??\n> 현재 시장은 닷컴 버블처럼 심각한 수준으로 붕괴될 것 같지는 않다고 판단 > 현재 시장은 마치 돌다리를 두들겨 보면서 건너듯이 신중\n> 향후 사모 신용이 토큰화되거나 RWA와 같은 토큰화된 채권 형태로 개인 투자자들이 디파이 등을 통해 투자하게 되는 시점이 온다면, 그때부터 위험 요소가 생길 수 있다고 생각\n\n- AI + 바이오 : \n> AI 개발을 주도하는 사람들의 궁극적인 관심사가 영생이기 때문에, 바이오 분야에도 많은 자금이 몰릴 수밖에 없다고 생각\n> AI 시장이 점점 커지고 AI 분야를 선도하는 사람들이 엄청난 부자가 될 것이라고 확신\n> 구글이 설립한 Calico Labs, Retro Biosciences, Altos Labs, 아마존의 제프 베조스가 관여하는 기업, 일론 머스크의 Neuralink\n\n- 부자가 되는 투자 vs 부자로 사는 투자 원칙\n> 우리는 부자가 되는 투자가 아니라 부자로 사는 투자를 지향 > 운이 좋으면 누구나 자산이 10배로 불어나 몇십억 원대의 부자가 될 수 있음\n> 이러한 자산을 지속적으로 유지하고, 다음 변동성 속에서도 살아남아 꾸준히 우상향하기 위해서는 단순히 운에만 의존해서는 안 됨\n> 운이 계속 좋을 수 있는 상황을 유지하며 부자의 삶을 살아가기 위해서는 확고한 원칙이 있어야 한다고 생각\n>> 따라서 이러한 하락장 때마다 자신이 '부자가 되는 투자를 지향하는가?' 아니면 '부자로 사는 투자를 지향하는가?'를 한 번쯤 점검"}, {"date": "2026. 7. 31", "sortDate": "2026-07-31", "title": "이번 하락장의 제물이 밝혀졌다...(ft. 시타델)", "core": "- 이번 하락의 타겟은??? 레오폴드의 Situational Awareness 펀드 ?!\n> 주요 포트폴리오는 블룸에너지, 네비우스, 아이렌 등 AI 인프라 건설 흐름의 수혜주\n> 결국 마진콜을 막지 못하고 7/30에 포트폴리오를 헐값에 넘겨버렸다는 뉴스\n> 청산 뉴스가 나오자마자 SA 펀드의 포트폴리오 주식들이 급등하면서 30%대 상승\n>> 범인은 공격을 통해 가장 이득을 본 사람 == 켄 그리핀이 운영하는 시타델(Citadel) > SA 펀드의 포트폴리오를 헐값에 넘겨받음\n(* Citade : 이번주에 연준이 '깜짝 금리 인상'을 할 수도 있다는 언플을 함. 2021년 로빈후드 게임스톱 매수 버튼 금지 사태의 흑막으로 꼽히면서 ‘세력’ 이미지가 커진 회사)\n>> 겨우 25살이 무려 60조원짜리 펀드를 4배 레버리지로 굴리고 있다!'는 소문은 헤지펀드들 사이에서 아주 먹음직스러운 먹잇감\n> SA 펀드 포트폴리오 : (가장 많은) 블룸에너지에는 악재와 공매도 세례 > (전체 비중으로는 가장 컸던) 네오클라우드 섹터도  공매도가 확대되며 폭락\n추가로, 공매도했던 소프트웨어 섹터는 최근 상승하면서 펀드 손실을 더 키움\n>>> SA 펀드를 흔들어 레버리지를 털어먹기 위한 과정, 그리고 SA 펀드에 마진콜이 도래하면서 청산 매물이 쏟아지는 과정의 일부\n\n- 애플 실적 발표\n> 마진율 : 50.1% (Est 47.9% 상회) > 메모리 원가 상승으로 인해 어려움이 있음에도 마진율 상회\n> (매출1) 아이폰 매출 : 542억 달러 (Est 538억 달러 상회)\n> (매출2) 서비스 매출 : 307억 달러 (Est 312억 달러 하회) \n> 가이던스도 시장 전망치보다 낮게 잡아서 시장이 실망 > 9월에는 지금보다 더 비싸진 메모리 가격을 내야할 것 같다고 말하면서 앞으로는 마진율을 지키기가 점점 어려워질 수 있다는 생각\n> 대안으로 밀었던 중국 메모리 수입도 미국 정부가 막아선 모양새\n>> 주가 6% 하락\n\n- 아마존 실적 발표\n> 매출 : 2,006억 달러 (Est 1,962억 달러 상회)\n> 영업이익 : 275억 달러 (Est 235억 달러 상회)\n> AWS와 반도체 사업 : 전년 대비 세자리 수% 성장을 하면서 ARR 250억 달러 달성\n>> 특히 AWS는 4년 만에 가장 빠른 분기 성장률을 기록하면서 성장세가 빨라짐\n> FCF (Free Cash Flow)가 음전 했음에도 주가는 9%넘게 상승\n\n## 레오폴드의 SA펀드가 이번 청산에도 불구하고, 앤스로픽 지분 $5B어치만큼은 이번에 매각하지 않고 계속 보유\n> 오픈AI와 앤스로픽 등 프론티어 랩들의 매출 성장은 빠르게 이루어지고 있음\n> 앤스로픽의 현재 ARR은 710억 달러로 전세계 스타벅스와 맥도날드, KFC를 다 합친 수준\n> 오픈AI ARR도 3월 말 269억 달러 → 6월 말 373억 달러 → 현재 기준 477억 달러 정도"}, {"date": "2026. 8. 3", "sortDate": "2026-08-03", "title": "일본 환율을 살려야 미국이 사는 이유 (ft. 베센트 재무장관과 장기금리)", "core": "- FOMC \n> 연준 FOMC에서 얻은 새로운 정보는  케빈 워시 연준 의장이 기준금리 자체를 활용하기보다, 시장이 장기금리를 통해 알아서 긴축 효과\n>> 케빈 워시는 AI의 발달에 호의적인 입장이기 때문에 AI 투자를 금리 인상으로 식혀야 할 과열된 수요라기보다는 굳이 잡을 필요가 없는 생산적인 투자로 볼 확률이 높음\n>> 연준이 당장 적극적으로 장기금리를 완화해줄 생각이 없다는 게 밝혀졌으니 '장기금리 관리'라는 공은 재무부로 넘어간 모양새\n>> 재무부 카드 : 미국과 일본이 (15년만에) 엔화방어 개입 > 일본이 먼저 대규모 엔화 매수 개입을 했고, 미국 재무부까지 여기에 동참\n\n- 미국 & 일본 엔화 공동 개입\n> 일본 입장 : 인플레이션을 잡기 위해 금리를 올려야 하는데 > 국가부채 이자 부담때문에 못 올림 >  금리를 못 올리니 미국/일본 금리차 때문에 엔화가 계속 유출(엔화 가치 하락)\n> 이에 보유하고 있는 미국채를 팔아서 자본을 마련해야 함 > 미국 눈치 > 미국도 미국채 관리를 위해 개입\n>> 미국 개입 방법 : 유로화 팔아서 엔화 매입 >일본에게는 FIMA 레포 제도 확대를 권고(해외 중앙은행들이 보유한 미 국채를 미국에 담보로 맡기고 달러를 빌려 쓸 수 있게 해주는 장치)\n>> 재무부가 장기금리를 본격적으로 관리하기 시작 (우측 '베센트' 글 참고) > 일본 금리 인사 여부 모니터링 필요 !\n\n- 미국채 금리 수요 하락 & AI 기업 채권 대량 발행\n> AI 투자 수요가 너무 폭발적이라 채권 시장에 찾아오는 자금 수요자들이 많고, 따라서 원래라면 국채에 들어갔을 자금들이 AI 채권으로 빠지면서 국채의 인기가 떨어지는 것\n>> 빅테크들도 원래는 벌어들인 현금을 장기채로 보관하는 채권 수요자들이었는데, 얘네들이 AI 투자를 많이 하니까 채권을 사는 대신 채권을 발행하는 쪽으로 바뀌면서\n\n+) 시타델과 Situational Awareness(SA) 펀드 관련 뒷이야기 : SA 펀드가 흔들리던 7월에 SA 펀드의 위험 노출도가 어느 정도인지 내부 정보가 이미 헤지펀드 사이에서 공유\n> 헤지펀드들은 SA 펀드가 마진콜을 맞추기 위해 주식을 일부 매각할 것으로 예상 >. 미리 그 종목들에 숏을 쳐서 하락폭을 더 키움\n> 결과적으로 시타델이 레오폴드 펀드의 주식 포트폴리오를 시장가보다 10% 넘게 할인된 가격으로 넘겨받았고,\n그날 바로 20~30% 상승한 종목들도 많다보니 한방에 30~40% 수익을 낸 것"}, {"date": "2026. 8. 4", "sortDate": "2026-08-04", "title": "프론티어 VS 오픈소스 AI 경쟁의 최고 수혜자는? (ft. 팔란티어 실적발표)", "core": "- 팔란티어 실적 발표\n> 매출은 19.35억 달러 (Est 18.1억 달러, 7% 상회)\n> 주당순이익  $0.41 (Est $0.35, 17% 상회)\n> 주가 $125 -> $162 (30%상승)\n>매출 : 전년 동기 대비 +93% (1년 만에 2배 성장하며 역대 최고치 매출)\n> 순이익은 전년 대비 +156% 성장\n> Net income : ($M) 327 > 476 > 609 > 871 > (Q2.2026)1,062\n> 알렉스 카프 (왈) : \n>> 돈을 내고 쓰면서도 기업의 가장 중요한 비밀을 자발적으로 유출하는 꼴\n>> 우리와는 매우 다르게 생각하는 소수의 사람들(프론티어 랩)이 사업의 가치와 매출을 사실상 흡수하면서 위험은 우리에게 떠넘기는 얄팍한 철학을 가진 모델로 퇴행하면 안 된다\n>>> 오픈 소스 부흥하기 위한 멘트 !\n\n- (새로운 AI 모델들이 성능 벤치마크에 최적화되는) 벤치맥싱(benchmaxxing)의 시대 > (실무에 걸맞는 고유의 벤치마크를 만들어내는) 벤치메이킹(benchmaking)의 시대\n> 엔비디아의 오픈소스 모델인 Nemotron Ultra를 적용한지 24시간 만에 니모트론이 프론티어 모델을 이기는 새로운 벤치마크 5개를 발견\n>> 실무에서는 회사마다 워낙 사용 행태가 다양하기 때문에 기존의 벤치마크만 가지고는 AI 모델의 전반적인 성능을 측정하기 어렵고, 프론티어가 최고 성능을 낸다는 보장도 없다 \n\n- 모건스탠리 리서치 : 프론티어 VS 오픈소스 경쟁\n> 내용 : 오픈 모델이 계속 발전하면 프론티어 AI 기업의 시장 점유율을 빼앗는 데서 끝나지 않고, 오히려 AI 사용량 전체를 늘릴 가능성이 크다는 주장\n>> 모델 가격이 싸지고 배포가 쉬워지면 기업들이 AI를 더 많이 사용하게 되고, 반도체/데이터센터/전력 수요도 함께 증가한다는\n> 시나리오1(프론티어) : 프론티어가 이기는 시나리오가 되면 오픈AI, 앤스로픽과 더불어 구글, 메타 등  프론티어 모델 역량이 있는 하이퍼스케일러가 수혜 (+브로드컴)\n> 시나리오2(오픈소스) : 팔란티어와 마이크로소프트 같은 회사도 수혜를 보고, 미니맥스와 알리바바 같은 중국 모델 회사들이 최고 수혜 (+델, 온프레미스 인프라 회사)\n> 시나리오3(하이브리드) : 팔로알토 네트웍스, 크라우드스트라이크 등 보안 소프트웨어 섹터, 데이터센터 현장 전력생산 솔루션, 네오클라우드 섹터, 엔비디아\n*하이브리드 : 고난도 코딩이나 생산적인 일에는 프론티어 모델을 쓰고 반복적인 작업이나 고객 응대, 사내 검색 등에는 오픈 모델을 쓰는 구조. \n** 현재는 이미 기업들의 60%가 오픈 모델을 섞어 쓰고 있기 때문에 하이브리드 시나리오가 진행되는 중\n>>> 프론티어 VS 오픈소스의 모델 경쟁은 제로섬이어도 AI 인프라 시장은 제로섬이 아니기 때문에 양쪽이 팽팽하게 싸우는 게 엔비디아 같은 AI 인프라 대장에겐 유리\n\n+) 스페이스 X 실적 발표 전날\n> 이미 락업해제 우려로 공매도와 매도가 많이 나옴 > 정찰병 보내놓은 상태"}, {"date": "2026. 8. 5", "sortDate": "2026-08-05", "title": "엔비디아만 노났던 스페이스X, AMD 실적발표", "core": "- 스페이스X 실적 발표 (+12월까지 락업이 계속 풀릴 예정)\n> 매출은 78억 달러, 전년 대비 92% 증가 (Est보다 14.5% 상회)\n> 영업손실 -1.4억 달러 (Est -14.5억 달러)\n> 스타링크 매출 : 42.9억 달러. 전년대비 65.8% 성장 > 올해 팔콘9 발사 중에서 스타링크 관련 발사가 약 80%를 차지\n> 팔콘9 발사 가능 물량이 2028~2029년까지 사실상 모두 예약된 상황 >> 발사 병목이 조금씩 현실화되는 모양새\n> AI 부문 분기 매출 : $ 737M > $2.56B, 전년 대비 무려 247.5% 성장\n> 주가 : $125 -> 108.27 (-13.6%)  >> 높은 CapEx(183.7억 달러) 또는 연말까지 락업 우려로 하락 ?!\n> 일론머스크 (왈)\n>> 현재 최대의 병목은 메모리. 현재 메모리의 생산량이 연간 20%씩 증가하고 있는데, 원래라면 어떤 산업과 비교해도 굉장히 빠른 속도로 공급량이 증가하는 거지만,\n>> 수요는 연간 20%가 아니라 200%씩 증가하고 있기 때문에 한동안 추가 가격 상승이 불가피할 것이라고 전망\n>> (AI관련) 수요가 강해지면서 체결하는 계약마다 경제성이 점점 좋아지고 있고, 연산력 관련 신규 자본 투자의 회수 기간이 1년 미만(!)\n>> 올해 연말까지 2GW, 내년 말까지 5GW보다는 10GW에 가까운 숫자를 목표로 두고 연산력을 확보하겠다\n>> (+) 이 과정에서 일론 머스크가 앞으로 엔비디아에만 집중해서 구축하기로 결정\n> 정수형 : 스페이스X는 락업이 완전히 풀리는 12월까지 아주 조금씩 천천히 늘려갈 계획"}, {"date": "26/8/6(LIVE)", "sortDate": "2026-08-06", "title": "2027년을 향한 AI 투자 전략", "core": ""}, {"date": "2026. 8. 7", "sortDate": "2026-08-07", "title": "네오클라우드 숏을 선언한 마이클 버리 (ft. ORCL, NBIS)", "core": "- 마이클 버리, 네오클라우드 숏 (Short position : 오라클$144, 네비우스$211.17)\n> 논리 : 잔여 물량을 보증하는 백스톱 계약이나 구매 확약 등(GPU 구매 약정, 장기 임대 계약, 엔비디아 백스톱, 전력 계약 등) \n대차대조표에 드러나지 않는 부채가 너무 많아서 ‘단순히 이거 위험한 것 아니냐?’ \n> 네비우스 주가 -13%\n>> 시타델이 네비우스를 포함한 레오폴드의 포트폴리오를 인수한 상태라 자기 전리품을 공격하는 버리가 고깝게 보일지도"}, {"date": "2026. 8. 10", "sortDate": "2026-08-10", "title": "워렌 버핏은 롱, 마이클 버리는 숏, 누가 맞을까? (ft. 장기금리)", "core": "- 스페이스X, 락업해제 우려에도 급상승 ($114 -> $133.11 , 16%상승)\n> 보통은 락업이 풀리면 매도 물량이 나오면서 주가가 떨어지지만 이렇게 전세계적으로 이미 어그로가 끌려 있는 경우엔\n공매도로 인해 매도 압력이 미리 나온 경우가 많아서 오히려 주가가 폭등하며 숏 투자자들이 '레오폴드 당하는' 경우도 생기는 것 같다.\n> 스페이스X 상장 이후에 우주 섹터 주가가 전체적으로 끌어내려진 감이 있지만, 락업과 별개로 우주 섹터 자체의 전망은 어느 때보다도 좋음\n우주 통신업 경쟁이 본격화되면서 우주 발사를 활용한 서비스들이 본격적으로 매출을 키우는 초입에 있고, 미국, 중국, 러시아 등 국가 차원에서의 소버린 우주 경쟁도 가속화되는중 \n> 우주 섹터는 장기금리에 큰 영향\n>> 미국 재무부가 채권 시장의 변동성을 줄이겠다는 개입 의지를 보여준 만큼 장기금리가 추가로 오를 여력은 어느 정도 제한된 분위기\n*이자를 안 주기 때문에 높은 장기금리와 경쟁해야 하는 비생산적 자산(금/비트코인 등), 먼 미래를 팔아야 해서 장기금리에 할인을 많이 받는 성장주 섹터(우주/양자 등)\n*장기금리의 상방이 어느정도 막혔다고 본다면 높은 장기금리에 타격을 받던 섹터도 단기적으로 바닥을 쳤다고 봄\n\n- 버크셔 헤서웨이,  2분기 실적발표 : 2022년 이후 처음으로 현금 보유액이 감소하며 주식 순매수 상태로 전환\n> (대표적으로) 구글에 100억 달러 \n> 주택 건설업체에 68억 달러 투자\n> 자사주 45억 달러를 매수\n>> 총 매수 235억 달러, 매도 37억 달러 = 순매수 198억 달러를 기록 >> 시장에 훈풍\n\n- 현재 AI 섹터의 가장 큰 병목은 자본(capital) : 모두가 동시에 투자와 자금조달에 뛰어들면서 자본 시장의 돈이 부족한 지경에 이르렀기 때문\n> 엔비디아, 스페이스X, 구글, 아마존 등 빅테크들이 연달아 대규모 채권을 발행해 채권 시장의 자금을 빨아들이다보니 미국 국채의 인기도 떨어지고 채권 금리도 올라가는 중\n>> 이에 '미국이 AI 경쟁에서 중국을 앞설 수 있는 핵심 차별점’이자, 미국 정부 입장에서 절대 무너뜨리거나 포기할 수 없는 영역\n>> 중국은 미국보다 채권 금리가 낮은 편인데, 자본이 성장 속도의 병목을 잡는 시대에는 싼 값에 돈을 많이 빌릴 수 있는 게 경쟁력\n>>> 미국은 AI 경쟁 관점에서는 더더욱 채권금리를 안정시켜야 할 유인이 있고  금리 인하를 해야 할 이유\n\n- 미국 의회에서는 양자컴퓨터 지원 연간 예산을 68% 늘리는 법안이 검토되는 중\n> 시장이 다시 Risk-on(위험주 선호) 상태로 돌아갔을 때 올라갈 수 있는 상방 자체는 점점 높아지고 있는 상황"}, {"date": "2026. 8. 11", "sortDate": "2026-08-11", "title": "첫번째 시험대에 오른 베센트의 금리 안정화 (ft. 로켓랩 실적발표)", "core": "- 미국과 일본의 구두 개입에도 불구하고 엔화가 다시 오르며 미국 10년물 금리가 다시 상승\n> 시장 : 이번에 튀는 걸 잘 막아주면 예상대로 시장이 안심하고 Risk-on 모드로 위험주 투자를 이어갈 것이고, 튀는 걸 못 막게 되면 다시 Risk-off 하겠다\n>> 엔 약세와 채권 금리를 관리하겠다는 강한 의지를 밝힌 만큼 미국 재무부나 일본 재무성에서 금방 추가 조치가 나올 것이라는 판단\n\n- 로켓랩 실적 발표\n> 뉴트론은 현재 발사대에서 모든 부품을 조립하기 전에 최종 점검을 남겨둔 상황\n> 매출 : 2.3억 달러(전년 대비 +62%)\n> 초기 뉴트론 발사 수요가 이미 다 예약되어 확정(스페이스X도 내부수요 발사에 집중)\n> 이리듐 인수를 통해 가장 높은 수익성이 기대되는 통신업 + 인공위성 사업 수직계열화가 완성되고 있음\n*일반 소비자 대상 고속 브로드밴드 인터넷보다는 신뢰도 높은 군용, 항공/해안 안전용 통신 중심\n> 방산 계약이 점점 늘어나는 중(NSSL 계약 상한금액 3배 증가 등)\n> 생산 일정은 2026년 4분기에 뉴트론을 발사대로 인도하는 목표와 맞춰져 있다 (생산일정 =/ 발사일정)\n>> 실질적으로 발사가 2027년으로 넘어갈 것 같다는 뉘앙스 > 실질적인 발사 일정은 2027년 1~2분기로 기대하는 게 현실적\n> 새로운 발표 : 우주 발사 수요가 전세계적으로 확장하는 흐름에 맞춰 전세계 어디든 확장할 수 있도록 빠르게 발사장을 구축/전개하는 GHOST라는 새로운 기술\n* GHOST : 원하는 장소에서 빠르게 발사하는 능력이 중요한 HASTE 임무, 방산 니즈 > 유럽과 아시아 등 글로벌 매출을 더 확장하는 데도 도움이 되는 부분\n> 주가 : 하락. 실적발표 전에는 장기금리 상승으로 압박을 받고 실적발표에서는 뉴트론 연내 발사 확률이 낮아지는 뉘앙스\n> 피터벡 (왈)\n>> 가장 중요한 건 '첫 번째 발사를 언제 하느냐'지만, 두번째로 중요한 건 '10번째 발사를 언제 하느냐(확장 속도)'이고\n첫번째 발사와 10번째 발사 사이의 갭을 줄이는 노력을 하고 있다고 하니 첫번째 발사는 늦어지더라도 이후 확장 단계까지 늦어지진 않을 것\n>>> 우주 산업에서 가장 많은 종류의 병목을 쥐고 있는 기업은 여전히 로켓랩\n>>> 정수형 : 시장은 아직 뉴트론 발사를 중심으로 보고 있지만 더 중요한 건 우주 시스템/부품 공급망이라고 생각하기 때문에 우주 섹터의 주력 포트폴리오로 계속 장기 보유해갈 예정\n\n- 엔비디아, 중대 발표\n> Apollo, BlackRock, Blackstone, Brookfield, Goldman Sachs, KKR과의 파트너십\n> 목적 : 장기적으로 5,000억 달러 이상의 제3자 자본을 동원해  AI 인프라 구축을 지원하는 독립적인 금융 플랫폼을 만드는 것 \n>> 총 $500B, 1GW당 $50B 기준으로 계산하면 10GW 수준\n> 광범위한 생태계는 NVIDIA 컴퓨트를 사용할 잠재 고객과 구매자(offtaker)의 시장을 깊게 만들어주며, 결과적으로 잔존가치(residual value)를 보호하는 데 도움이 된다.\n> 고객들은 A100 컴퓨팅 용량에 대해 여전히 수년짜리 계약을 체결하고 있으며, 이에 따라 A100의 경제적 수명은 10년에 가까운 수준까지 연장되고 있다.\n> 1년 계약 기준 H100 임대 가격은 2025년 10월 GPU당 시간당 약 1.70달러에서 2026년 3월 약 2.35달러까지 상승\n> Blackwell 용량은 여기에 프리미엄까지 붙음. 보고된 B200 클라우드 가격은 GPU당 시간당 약 5.30~7.05달러에 형성\n> 많은 뛰어난 AI 기업, 일반 기업, AI 클라우드 사업자들은 컴퓨트 수요를 가지고 있지만,  필요한 속도와 규모로 인프라를 구축할 수 있을 정도의 자본이나 낮은 금융비용에 접근하지 못하고 있다.\n> 수요는 실제로 존재한다. 프론티어 AI 연구소, AI 네이티브 스타트업, 일반 기업, 클라우드 사업자, AI 서비스를 구축하는 국가들로부터 수요가 나온다."}, {"date": "2026. 8. 12", "sortDate": "2026-08-12", "title": "실적발표 시즌의 주인공으로 떠오르는 네오클라우드 섹터 (CRWV, NBIS 실적발표)", "core": "- 코어위브, 실적발표 (주가 $90.32 -> $107, 19.2% 상승)\n> 매출 25.75억 달러 (예상치 25.6억 달러, 1% 상회)\n> 주당순이익 $-1.14 (예상치 $-1.47보다 적자폭 22% 줄임)\n> 확보한 계약 전력 규모는 [2분기 기준 총 3.7GW] -> [500MW를 추가, 현재 4.2GW확보] -> 실제 가동 전력은 1.5GW로 네오클라우드 중에서는 최대 수준\n> 백로그(backlog) :전년 대비 246% 성장한 1,040억 달러, 이건 2분기 말 기준 숫자 >> 3분기 중에 벌써 여기에 250억 달러 이상이 더 추가\n>> 2분기에 체결한 신규 계약들은 이전의 최근 분기에 체결한 계약들보다 5~10% 정도 마진율\n> 2020년에 만들어진 A100 칩을 2029년까지 계약\n*코어위브 파산에 대한 보험 성격인 CDS 가격도 살짝 하락 안정화된 모습\n\n- 네비우스, 실적발표 (주가 $193 -> $259, 34% 상승)\n> 매출 : (전년 대비 +454%)\n> 주당순이익 : $-0.12 (Est $-0.7),적자폭을 예상치보다 83% 감소\n> 계약 전력 용량도 5GW로 상향\n> 새로운 계약의 70%가 선급금을 포함, 선급금이 CapEx의 50~60%를 충당 (나머지는 2분기에 ATM 유상증자 활용함)\n> 2분기에 체결한 계약들의 CapEx 및 운영비용 회수기간이 1년 10개월 (과거 2~3년) \n>> 네비우스 (왈)\n: 지금의 수요 수준을 보면 같은 조건으로 2027년 전체 용량을 지금 당장 계약해버릴 수도 있는데, 점점 조건이 좋아지는 추세이기 때문에 일부러 계약을 안 하고 용량을 남겨두는 전략\n>> (3분기에 이미 1건 체결) 3분기에는 처음으로 경매 방식과 단기 용량 계약을 도입했는데, 3~6개월 단위로 긴급한 수요를 가진 고객에게 비싸게 단기 계약을 하는 방식 \n+) 1년 이상 지연될 수 있다는 의혹이 있는 최근 바인랜드(Vineland) 사이트 관련 질문 : 낙관적으로 본다며 일단 뭉개는 모습을 보여줬는데\n혹시 문제가 되더라도 다음 실적발표 또는 다다음 실적발표 쯤에나 터지지 않을까 싶음\n*(GPU를 운영하면서 연산력을 팔면 네오클라우드, 데이터센터와 전력망만 임대하면 코로케이션 업체)\n\n- 시장\n> Core CPI : 0.2% (예상치 부합)\n> 금리 인상 확률 하락\n+) 트럼프 정부가 중간선거를 대비하기 위한 공화당 경제정책 중 하나로 양도소득세 인하를 검토한다는 소식"}, {"date": "2026. 8. 14", "sortDate": "2026-08-14", "title": "시타델이 인정한 역대급 실적 시즌, AI 수익성이 높아지는 이유", "core": "- 시타델증권) S&P 500 vs 나스닥 _ (Forward P/E) 선행 PER 지표를 정리한 그래프\n> 작년 4월(관세 폭락 때), 엔비디아가 100달러 아래 > 작년 하반기 대비 절대적인 주가 자체는 높아짐,\n하지만, 워낙 기술주들의 이익이 성장하는 속도가 빨라짐 > 나스닥이 싸보일 정도로 이익을 기준으로 한 PER 멀티플은 그때만큼 떨어짐\n*예를 들어 어떤 회사의 현재 주가가 $100이고, 애널리스트들이 향후 12개월 EPS를 $5로 예상한다면, Forward P/E = 100÷5=20배\n>> 워렌버핏이 구글과 같은 기술주 매수를 시작한 것도 이익이 성장하는 속도가 시장 예상보다 빠르기 때문이지 않을까\n>> 2020년 코로나 때처럼 돈이 너무 많이 풀려서 모든 자산의 멀티플이 올라가는 시장에서는 이익은 그대로인데 단순히 멀티플 배수가 올라가며 주가가 상승했던 거라, 누가봐도 버블\n>> 이번에는 실질적인 이익 성장이 주도해서 주가가 상승하고 있기 때문에 그 때와 같은 버블이라고 하긴 어려움\n>>> 오히려 장기금리가 계속 떨어지면 '혹시나 AI 인프라 투자 열풍이 느려지는 건 아닌지'를 더 걱정\n\n- 가동 전력 MW당 뽑아낼 수 있는 매출이 점점 올라가는 추세\n> CIFR, WULF, RIOT(Colocation) : MW당 평균 $1.3~1.8M\n> NBIS, CRWV, IREN(네오클라우드) : MW당 평균 $9~10M\n> 스페이스X(앤스로픽과 구글, 단기계약) : MW당 $30~50M\n>> 오픈AI랑 앤스로픽 : MW당 $100M까지 (GW당 $100B = MW당 $100M)\n>>> 네오클라우드가 단기 계약을 섞어 MW 전력당 수익을 대폭 키울 수만 있으면\n가격 폭등을 중심으로 생겼던 메모리 주가 상승과 비슷하게 네오클라우드 섹터의 주가도 성장세를 보일 수 있을 것\n* 코어위브는 확보한 4.2GW를 대부분 임차 / 네비우스는 확보한 5GW 중에서 75%를 직접 소유 중 / 아이렌은 확보한 전력이 5.8GW (전력망이 연결된 부지를 100% 실제 소유)\n* 마이클 버리 말대로 GPU가 빨리 감가상각되더라도 소유하고 있는 토지/데이터센터/전력설비 등은 여전히 높은 잔존가치\n* 5.8GW를 다 가동하게 되면 (MW당 매출을 더 높게 뽑지 않더라도) > 연간 ARR이 올해 목표인 40억 달러의 20배인, 800억 달러대 (=현재 오픈AI ARR(400억 달러)의 2배)\n(이 과정에서  자금조달도 엄청 하고 희석도 엄청 되고 우여곡절은 예상해야 함)\n\n- IREN, Horizon1 - MSFT 인도\n> 아이렌이 Horizon 1의 성공적인 인도. \n> 로버트 형제 : 이 정도 스케일의 건설은 보통 2~3년이 걸리는데, 아이렌은 부지와 전력망을 소유하는 수직계열화 전략으로 9개월만에 달성\n> 어제 거래 종료 이후 거래량을 보면 특이하게 무려 1000만주 넘게 거래된 기록\n>> 규모로 보았을 때 아마 이번에 아이렌이 인수한 미란티스 주주들이 인수 대금으로 받은 아이렌 주식 일부를 다른 기관투자자에게 넘기는 블록딜이었을 가능성\n>> 최근 아이렌의 기관투자자 비중이 높아지고 있는데, 주주 비중도 바뀌고 AI 매출 비중도 높아지면서 변동성도 점차 안정화 기대"}, {"date": "26/8/14(LIVE)", "sortDate": "2026-08-14", "title": "AI 조정장, 장기투자자는 무엇을 봐야 하나", "core": ""}, {"date": "2026. 8. 17", "sortDate": "2026-08-17", "title": "빅테크급 매출을 넘보는 앤스로픽, IPO 시장 영향은?", "core": "- 앤스로픽 IPO 관련\n> 시장에서는 10월 내에 상장하는 것을 유력\n> 오픈AI와 앤스로픽의 매출 규모가 하이퍼스케일러 + 네오클라우드 시장 규모를 좌우 > AI 인프라 섹터에 투자하는 입장에서 굉장히 중요\n> 앤스로픽 (26년 2분기 매출) : 115억 달러($11.5B), (25년 2분기 : 7억 8,700만 달러) >14배 넘게 상승 // (26년 1분기 매출 : 47.3억 달러, 2.4배)\n>> 조정 영업이익 기준으로 분기 흑자를 달성\n> 앤스로픽의 5월 ARR(연환산 매출)이 450억 달러 > 7월 기준으로는 벌써 ARR 700억 달러가 넘을 정도로 엄청난 성장속도 (전세계 스타벅스와 맥도날드, KFC를 다 합친 수준)\n>> 오픈AI도 3월 말 269억 달러 → 6월 말 373억 달러 → 현재 기준 477억 달러 정도\n> 앤스로픽 내부에서는 2028년 매출을 2,000억 달러($200B) 정도로 전망\n* 테슬라의 2025년 연매출이 948억 달러, 메타의 2025년 연매출이 2,010억 달러, 엔비디아의 최근 연매출이 2,159억 달러, 마이크로소프트(2,817억 달러)와 구글(4,030억 달러)\n>>> 이미 Too Big To Fail 단계에 진입 > 전세계적인 금융 버블이 생기지 않는 이상, 1차로 걱정할 단계는 지났다고 판단\n* 스탠리 드러켄밀러도 아마존 물량을 10배 증가 / 트럼프 대통령 사위인 재러드 쿠슈너의 동생인 조슈아 쿠슈너도 아마존 매수\n* 버크셔해서웨이 포트폴리오를 보면 구글의 비중을 3위까지 증가 (구글이 앤스로픽 지분을 많이 보유함에 간접 투자)\n>>> 정수형 : 앤스로픽과 오픈AI는 상장날부터 바로 30% 정도 정찰병을 보내고 나머지는 락업 일자에 맞춰 조금씩 진입해볼 생각\n>>> 정수형 : 오픈AI와 앤스로픽을 합쳐서 최소 10% 정도는 맞춰보고 싶다는 개인적인 생각"}, {"date": "2026. 8. 18", "sortDate": "2026-08-18", "title": "AI 성장 내러티브 VS 장기금리 우려 내러티브, 대응 전략은? (ft. 투자학개론 예약판매!)", "core": "- 미국채 30년 장기물  \n> 지속되는 미국 장기금리 상승세 > (8월 13일) 30년물 입찰에서는 5.22%를 기록 > (8/18)이번 5.31%를 기록\n>> 이 추세로 5.44%를 넘어가면 금융위기 초기였던 2007년 기록도 넘어섬 > 장기금리 입찰 결과가 뉴스 헤드라인이라 시장이 전체적으로 살짝 조정\n* 현재 장기채 금리 상승은 비단 미국만의 문제가 아니라 일본과 유럽에서도 나타나고 있는 전세계 공통적인 현상\n> 현재 자금이 채권시장보다 주식시장에 몰려있기도 하고, 채권시장의 주요 수요자였던 기업들은 AI 투자 때문에 채권을 안 사고 오히려 발행하는 중\n> 미국의 트럼프와 일본의 다카이치 총리 모두 새로 부임한 이후 세금을 줄이고 정부 재정을 확장하는 중\n* 국제 정세가 자국주의 흐름으로 분열되면서 인플레이션 우려가 늘어나는 영향도 큼\n> 일부 기관들은 장기채가 폭락 후 슬슬 바닥에 가까워진, '조금 물리더라도 매수를 시작할만한 구간'으로 보고 있는 듯\n>> 연기금이나 금융기관들이  ‘채권금리가 매력적인 구간에 왔다’는 멘트를 하기 시작\n\n- 장기채 금리 해결 방법\n1. 정부의 재정 지출이 줄어들거나,\n> 어느 정부든 예산을 늘리긴 쉽지만 줄이긴 어려움. 작년에 일론 머스크가 진행한 DOGE에서도 생각만큼 큰 절감 효과가 없음. 미국-이란 전쟁,국방비 지출은 오히려 커지는중\n2. AI 관련 채권 발행 속도가 줄어들거나,\n>  AI 관련 채권 발행을 못하도록 금지하거나 AI 경쟁이 자연스럽게 완화되어야 가능한 일 > 미국의 자유시장경제 체제에서 특정 분야 채권 발행을 금지하는 건 불가능\n> AI 인프라 경쟁에서 자본이 핵심 병목으로 떠오르는 가운데 중국도 자본시장 지원을 통해 미국을 바짝 따라오는 중이라 섣불리 하기가 어려운 카드\n>>> 이 방법은, AI 투자에 있어 높은 장기금리보다 훨씬 큰 문제이기 때문에 그 때는 장기금리가 문제가 아닌 상황\n3. 연준에서 장기채를 많이 사주거나,\n>  케빈 워시 : 양적 완화를 싫어하는 성향이고 대차대조표를 0로 만들겠다는 신념 > 케빈 워시가 장기채를 사서 대차대조표를 늘려주길 바라는 건 현실적으로 어려움\n4. 재무부에서 장기채 발행을 획기적으로 줄이거나, (## 이게 그나마 현재 트럼프 정부가 쓸 만한 카드)\n> 단기채는 금리가 상대적으로 낮아서 부담이 적지만, 금방금방 만기가 돌아와 다시 새로운 채권을 발행해야 하기 때문에 안정성이 떨어지고 경기 변화에 취약해진다는 단점\n>> 하지만 중간선거를 앞둔 트럼프 정부는 유권자들을 위해 주택담보대출 금리도 최대한 낮춰야 하고 이들의 은퇴자금이 걸려있는 증시도 최대한 부양해야 할 유인\n>> 이 단기채 수요를 받쳐주는 게 스테이블코인 발행사 > 스테이블코인 시장을 키울 유인은 어느 때보다도 커진 상황\n>>> 4개 다 쉽지 않은 일이기 때문에 저번주에 ‘고금리가 뉴 노멀(New Normal)이 될 것으로 보고 있다’\n>>> 이번에도 장기금리 이슈가 주식시장 전체적으로는 하방 압력을 줄 수 있지만, 오히려 그렇기 때문에 장기금리보다 성장성이 확실하게 좋은 AI 클라우드나 \n현금 창출력이 좋은 메모리는 역으로 수혜를 볼 가능성도 있는 환경"}, {"date": "2026. 8. 19", "sortDate": "2026-08-19", "title": "일제히 시장 기대감을 낮춘 프론티어 AI 연구소들 (ft. Open AI Q2)", "core": "- 상장을 앞두고 있는 앤스로픽과 오픈AI의 매출에 대한 의문\n> 앤스로픽 ARR이 최근 유출된 예상치보다 더 낮을 거라는 소식 + 오픈AI의 2분기 매출 성장이 둔화되었다는 소식이 겹침\n* 오픈AI 2분기 매출 : 67억 달러 (1분기 57억달러, 대비 18% 증가)\n* 앤스로픽 2분기 매출 : 116억 달러 (1분기 47억달러, 대비 145% 증가) > 앤스로픽이 그냥 제친 게 아니라 큰 격차로 앞섬\n** GPT-5.6 Sol 출시가 3분기로 넘어간 7월 이후/코덱스와 챗GPT 앱을 통합 후 코덱스 사용량도 늘어나서 3분기 결과가 나오면 다시 오픈AI의 성장률이 치고 올라올 수 있는 상황\n> 7월 말에 The Information이 전한 내부 현황 : 앤스로픽의 현재 ARR이 710억 달러에 달한 것\n> 8월 7일 기술계에서 유명한 All-In(올인) 팟캐스트 : ‘현재 앤스로픽의 ARR이 800억 달러도 넘어서서 연말 ARR 목표인 1000억 달러도 더 빨리 달성할 것\n> 8/18 :앤스로픽, ARR 650억 달러(7월 말 기준)에 도달했다는 내용\n>> 710억, 800억, 650억 셋 다 회사의 공식 입장이 아닌 '익명의 내부자'가 출처\n>>> 성장률의 장기 추세가 크게 꺾이지 않는지가 AI 섹터에 장기투자하는 입장에서 주시해야 할 포인트"}, {"date": "2026. 8. 20", "sortDate": "2026-08-20", "title": "다시 시작된 트럼프의 리딩방? (ft. 비트코인)", "core": "- 미국 재무부에서 장기국채 매입 규모를 2배로 늘렸다는 소식 ( =  단기채로 장기채를 돌려막는 신공)\n> 그만큼 단기채를 더 많이 발행해야 해서 실질적인 유동성 공급 효과는 없고 장기금리 대신 단기금리는 오를 수도 있는 부작용 가능성\n>>  장기채 공급은 확실히 줄어드는 것이기 때문에 지금처럼 장기금리는 관리해야 할 때는 유용\n* 매입 규모를 2배로 늘린 기한 : 9월 9일부터 11월 4일까지 (중간선거 11월 3일)\n> 현재 시장을 보니 단기금리도 상당히 안정적이라 위로 튀는 부작용없음\n> 장기채와 달리 단기채는 스테이블코인 발행사들이 많이 사주는 것으로 해결할 수 있기 때문에 충분히 정책당국이 컨트롤할 수 있는 부분\n>> 장기금리에 대한 대응책 + 반감기 사이클 측면에서  여러모로 나쁘지 않은 환경 (비트코인과 이더리움은 각각 +8%, +18% 상승)\n>> ‘암호화폐 대통령(Crypto President)’을 내세운 트럼프의 11월 중간선거까지 3개월도 남지 않았기 때문에 이미 저점을 지나 지속적인 상승 추세를 보일 가능성\n\n- 백악관에서 트럼프 대통령과 암호화폐 기업들의 행사\n> 암호화폐 시장에서의 중국과의 전쟁에 대응해 클래리티 법안 통과를 강력하게 촉구한다는 메시지\n> 미국의 전략적 비축자산으로서 비트코인의 지위를 다시 한 번 확인해주고, ‘상당한 규모의 비트코인 매입 가능성’에 대해서도 운을 띄움\n> 토큰화주식 관련해 뜨고 있는 하이퍼리퀴드(HYPE)도 깜짝 샤라웃 (하이퍼리퀴드 기업의 로비 효과?!)\n>> 클래리티 법안이 되든 안되든 SEC와 CFTC 등 규제기관을 통해 코인 기업들을 밀어주겠다고 가이드라인을 내놓은 만큼 크게 기대하거나 걱정할 필요는 없을 듯"}, {"date": "26/8/20(LIVE)", "sortDate": "2026-08-20", "title": "강력한 사람들이 원하는 미래", "core": ""}, {"date": "2026. 8. 21", "sortDate": "2026-08-21", "title": "비트코인이랑 장기금리 누르는 거랑 무슨 상관이지? (ft. 베센트)", "core": "- 재무부, 바이백 선언\n> 바이백 2배 증액은 9월 9일부터 시작 > 실제로는 아직 들어간 돈 없이 구두개입 수준 > 30년물 등 장기금리는 다시 발표 전 수준으로 돌아간 상황\n>> 장기금리의 심리적 상단이 발견되었다는 것만으로도 시장에는 상당한 의미 > 채권에 숏을 치거나 장기금리 상승에 베팅하는 손익비를 나쁘게 만드는 것\n>> 장기금리가 조금씩 더 튀어올라갈 수는 있어도 천장에 가깝다는 인식과 이걸 장기채권 가격으로 치환하면 여기서 조금 더 떨어질 수는 있어도 바닥에 가깝다는 인식\n\n- 비트코인 상승 이유?\n>  정부가 장기금리 상승을 억지로 눌러서 이자를 낮게 주려고 하니까 (오르는 금리를 박스권으로 막으려 하니까)\n채권 보유자 입장에서 이자는 받고 있지만 실질적인 구매력, 실질금리 수익률은 기대보다 떨어지고 있는 상황을 감내\n>>  채권에 대한 수요는 감소하고, 그 자본이 채권/화폐의 구매력 감소를 방어할 수 있는 금이나 비트코인 같은 자산으로 일부 이동 (= 달러 숏)\n>> 정부가 장기채 대신 단기채를 늘리는 등 정책적으로 장기금리 상승을 억제하고 있기 때문에 그 우려에 대한 반영이 장기금리 대신 다른 쪽으로 이동하는 것으로 보임\n* 장기채 숏 = 시장이 미국에 더 높은 금리를 요구할 것\n* 달러 숏 = 미국이 그 높은 금리를 허용하지 않고 통화가치로 비용을 지불할 것\n> 현재 전세계적으로 미국 뿐만 아니라 일본, 독일, 프랑스 등에서도 정부지출 증가, 재정적자, 인플레이션 등으로 장기국채 금리가 고점을 찍고 있는 상황\n>> ‘달러’에서 ‘다른 통화’로 넘어가는 게 아니라 ‘화폐’에서 ‘금/비트코인 등 비화폐 자산’으로 넘어가는 게 더 합리적\n>> 현재의 장기채 숏은 미국 뿐만 아니라 전세계적인 국가부채에 대한 숏인데, 이걸 구현하는 방향성이 결국엔 금/비트코인 롱으로\n\n- 미국 장기채 금리 해결방법 -> 재무부 : 단기채로 바이백 ?! -> 긍정인가, 부정인가\n> 정수형 : 베센트가 장기채 대신 단기채를 늘리는 추세를 중간선거 이후에도 트럼프 임기 중에는 이런 큰 방향성 자체는 유지될 확률이 높다고 생각\n>> 현재 고금리가 일시적인 상황이라는 판단 하에서는 지금 장기채를 찍어서 10년~30년 동안 고금리로 고정해두는거보다는\n일단 단기채 위주로 몇 년 버티고 미래에 AI로 인한 생산성 증가로 금리가 내려오면 그 때 장기채를 많이 찍자\n* 전제는 정말로 AI 인프라 투자로 인한 경제성장률이 높게 나와줘야 한다\n> 긍정 : 정말 AI가 성장으로 이어지면 경제 성장률이 기대보다 훨씬 올라가고 금리는 지금보다 훨씬 낮아질 수 있으며 역사적인 장기 강세장을 맞이 > 과도기를 매끄럽게 이어주는 현명한 정책 결정\n> 부정 : AI가 성장으로 이어지지 않으면 미국의 재정정자를 더 크게 키운 상태로 시한폭탄을 미래로 넘겨버리는 꼴"}, {"date": "2026. 8. 24", "sortDate": "2026-08-24", "title": "연준의 포워드 가이던스 역할을 대신하려는 재무부? (ft. 엔비디아)", "core": "- 베센트 재무장관, 기자회견 (이란을 겨냥한 경제적 제재 계획)\n> 이란 전쟁의 막바지를 알리는 이벤트가 될 가능성도 높음 > 이란 전쟁은 아무래도 9월에 있을 시진핑과의 미중 정상회담 전에 마무리될 확률이 높아보임\n> 호르무즈 해협이 다시 개방될 경우 채권시장을 압박하던 인플레이션 우려가 잠시 완화될 수 있기 때문에 베센트 입장에서는 숨통을 조금 트이게 하는 첫번째 단추\n\n- 트럼프가 캐나다산 일부 제품에 50% 관세를 부과 시작\n> 규모로 따지면 50% 관세가 붙은 제품은 캐나다에서 수입해오는 물품의 5% 정도밖에 안되는 규모(200억 달러)고\n호르무즈와 관련된 유가는 모든 상품과 서비스에 영향을 끼치는 변수이기 때문에 이란 전쟁과 비교하면 무시해도 되는 수준\n\n- 엔비디아 실적 발표전\n> 엔비디아의 실적 가이던스 : 매출 $91B (작년 $46.7B 대비 96% 상승) , 마진율은 75% 수준\n>> 워낙 성장속도가 빠른데 주가는 최근 부진했기 때문에 엔비디아는 이제 P/E 기준으로 저평가 구간\n> 내년에 인도되는 블랙웰/베라루빈 AI 서버 칩 시스템 가격이, 약 17% 인상 (= 메모리 원가 상승분을 엔비디아가 흡수하는 게 아니라 고객에게 전가하겠다)\n* 엔비디아의 위치 : ‘원가 상승분을 고객에게 전가해도 되는 위치’, '가격 결정력을 가진 위치(=갑)'\n* 이번 가격 인상으로 데이터센터 1GW당 $5B 정도의 비용이 증가 (올 초에 젠슨 황이 1GW 데이터센터 비용이 현 $50~60B 수준에서 $100B까지 올라갈 것이라고 예고)\n\n- 엔비디아의 칩 가격 인상, 메모리 가격 고객(클라우드 기업)에게 전가 > 클라우드 기업 또한 고객에게 전가가 가능한가?\n> 클라우드 사업자가 과연 이걸 자체 마진율에서 흡수할 것이냐? 아니면 소비자에게 전가할 것이냐? (=클라우드도 엔비디아처럼 '갑'이냐?)\n>> 이번 칩 가격인상을 따라서 MW당 클라우드 단가가 올라가느냐 마느냐를 보면 네오클라우드도 엔비디아처럼 ‘원가 상승분을 고객에게 전가해도 되는 위치’인가?  라는 귀중한 정보\n* 한 가지 확실한 건 엔비디아는 네오클라우드 업체들이 잘되길 원하는 상황\n\n- (블룸버그에 올라온 기사) 요즘 헤지펀드들이 달러 숏(약세) 베팅\n> [영국의4대은행] 바클레이스 (왈) : 실제 장기채 수요자인 실투자자들은 아직 확실히 방향성을 정하지 못한 느낌. 헤지펀드들은 강한 달러 숏 움직임을 보였다\n> 보통 달러를 숏치려면 반대로 다른 화폐인 유로나 엔화 롱을 치게 되는데, 달러만 숏을 하기엔 유럽과 일본도 미국보다 나은 상황이 아니기 때문에\n개인적으로는 개별 화폐 숏보다는 여러 국가화폐 전체에 대한 전반적인 숏이 유리한 상황\n>> 즉 금/비트코인 같은 비국가화폐, 인플레이션 방어 자산 강세 베팅이 유리한 상황이 계속될 것으로 생각\n\n- 베센트 재무장관이 발표한 바이백 규모가 충분하냐 아니냐에 대한 논쟁\n> 케빈 워시 연준 의장이 앞으로는 포워드 가이던스(미래 전망)를 안 주겠다고 한 상황\n> 재무부가 적극적으로 신호를 주기 시작한 지금의 상황은 연준이 하던 포워드 가이던스의 역할을  재무부의 베센트가 대신 하는 꼴로 해석\n>> 베센트가 직접 챙기는 클래리티 법안 등을 통한 디지털 달러 생태계도 여러 옵션 중 하나라고 생각\n\n- 잭슨홀 미팅 : 케빈 워시가 적극적으로 의견을 밝히기보다는 생각보다 싱거운 발언만 하지 않을까 조심스럽게 예상"}, {"date": "2026. 8. 25", "sortDate": "2026-08-25", "title": "유동성 완화 카드를 꺼내든 재무부, 꿈틀대는 비트코인", "core": "- 재무부가 보유 현금 잔고(TGA) 일부를 활용해 금리가 높은 국채를 바이백할 수 있다는 소식\n> 모건스탠리 추정 : 바이백에 활용할 수 있는 자금이 $80~200B 정도\n> 현재 TGA 잔고는 $900B~1T 정도로 상당히 높은 수준 > 양적완화(QE)와 비슷한 효과 (최근 5년 기준으로 봐도 현금을 최고 수준)\n>> 실제로 개입이 들어가게 되면 유동성 측면으로는 상당한 효과가 있을 것으로 예상\n* 다만 시장은 점점 정부의 개입이 강해지는 것에 불안감을 표하는 중\n* 시장은 좋은 쪽으로 예상 못하게 급격히 움직이는 것보다는 안 좋은 쪽이라도 예상 가능하게 서서히 움직이는 걸 좋아함 > 정부 개입을 둘러싼 불확실성에 시장이 적응해가는 과정\n\n- 베센트 재무장관은 이란 대상 경제제재 기자회견\n> 이란 뿐만 아니라 이란과 거래하는 모든 국가에 경제적 처벌을 가하는 ‘연좌제 경제제재’를 발표\n> 이란과 거래하는 모든 기관들은 이란의 자금세탁을 돕는 것으로 간주하고 달러 결제망에서 배제될 것이라는 무시무시한 경고\n* ‘이란의 5개 생명줄’이라고 밝힌 디지털 자산, 기술, 금, 항공, 해운 부문이 주요 대상\n* 이란 전쟁 전인 올해 1월, 이란 리알화 폭락으로 이란에서 시위가 일어났을 때 환율이 달러당 140만 리알이었는데, 지금은 달러당 200만 리알까지 떨어진 상태\n> 질문(중국 대형 은행들의 달러 접근을 차단할 준비가 되어 있느냐) : 베센트 (왈) “미국의 제재가 미치지 않는 곳은 없다, 이런 문제를 다루는 가장 좋은 방식은 조용한 외교다”\n>> 9월 미중 정상회담을 앞두고 협상 레버리지를 위해  중국 금융기관까지 판에 올려둔 수로 보임\n> 현재 시장에서 베센트의 정부 개입에 대한 극단적인 거부 반응 vs 지금의 금리 상승은 탄탄한 AI 투자 수요를 보여주는 것\n>> 정부 개입으로 인한 역효과나 청구서가 언제 날라오는지 조심하고 나면 트럼프 정권 후반부엔 좀더 안정된 모습의 시장을 볼 수 있으리라 기대"}, {"date": "2026. 8. 26", "sortDate": "2026-08-26", "title": "아이렌 실적발표, 무엇을 기대하고 무엇을 기대하지 않을지?", "core": "- 러시아 언론사) 미국과 이란이 휴전에 합의했다는 소식\n> 인플레이션 우려를 나타내는 장기채 금리도 살짝 안정된 느낌\n> 유가는 확 안정되는 중\n\n- 비트코인\n> 재무부발 수요 이슈가 더해지면서 조금 일찍 상승세가 나타난 모양새\n> 정수형 : 2027년은 아무래도 AI 클라우드와 비트코인, 이 두 가지 큰 축을 중심으로 포트폴리오를 짜는 게 좋겠다는 생각\n\n- 아이렌 실적발표 전\n> 2026회계연도(2025.7~2026.6) 연간 실적 발표\n> 실적 관련 : 7월 20일 신규 AI 고객 계약이나 8월 마이크로소프트 Horizon 1 인도 등은 이번 실적발표 기간에는 미포함 +비트코인 채굴 인프라를 처리하는 과정에서 생기는 회계적 손실\n> 점검 사항\n1. 4.4B ARR 목표가 떨어지지 않고 오히려 4.6~7B 정도까지 올라갈 여지가 있는지,\n2. 저번에 이름을 밝히지 않은 미스테리 고객(new leading AI developer)은 어디인지,\n3. 아직 계약 안 된 15% 부분은 계약 되었는지, 되었다면 MW당 단가 및 계약조건은 얼마인지,\n*코어위브와 네비우스 등 네오클라우드는 단기 계약의 수익성을 강조 vs 아마존 AWS는 5년 장기 계약의 안정성을 강조 >> 아이렌은 ?!\n4. 자금조달 현황, ATM 썼으면 얼마나 썼는지(다 썼으면 호재?),\n5. 이번에 나온 엔비디아 자금조달 플랫폼 활용하는지,\n>> 가장 궁금한 건  Figure AI나 Perplexity 등 최근 계약에서  MW당 얼만큼의 단가와 계약조건을 뽑아낼 수 있느냐\n> 시장이 좋아할 만한 뉴스는 ATM 유상증자 프로그램을 다 썼는지, 다 썼다면 얼마나 남았는지\n>> 이번 ATM 한도를 다 채우고 나면 한동안 시장에 유상증자 물량이 안 나올 거라는 생각으로 투자심리가 다시 살아날 여지\n>> 앞으로는 주식 희석보다 GPU 담보대출이나 전환사채 등 채권 발행을 선택할 확률이 높습니다.\n\n> 채권 발행 조건 (네오클라우드 중)\n>> 아이렌 채권은 거의 모든 채권이 1% 금리\n>> 네비우스 채권은 기본 이자율이 1~2%대 수준 (만기에 갚아야 할 돈이 원금보다 15~20% 정도 늘어나는 조건이라 실질 이자율이 5%대 정도)\n>> 코어위브는 9%대 수준\n\n> 전체적인 평가 포인트\n>> 미란티스 인수 이후에 매끄럽게 시너지가 나고 있는지\n>> 엔비디아 버스를 잘 탈 수 있도록 엔비디아와의 협업이 계속 잘 이루어지는지"}, {"date": "2026. 8. 27", "sortDate": "2026-08-27", "title": "젠슨 황: AI, 변곡점을 넘었다. 버블의 수명을 늘리는 엔비디아", "core": "- 엔비디아 실적 발표 \n> 총매출 : $96B (실적 가이던스 $91B, 시장 예상치 $92.2B) \n*전년 대비 2배 이상\n> 3분기 가이던스 : 1080억 달러 (예상치인 1042억 달러 상회)\n* 젠슨황 (왈) : 전분기 대비 성장분은 데이터센터 ACIE 부문이 주로 견인할 것으로 예상한다.\n> 2028년 매출 성장률 전망 : 70% (월가 예상치가 44~45% 수준)\n> 데이터센터 매출 : 890억 달러(전분기 대비 18% 증가) (예상치 858억 달러 상회)\n>> 하이퍼스케일러 : 490억 달러 (전분기 대비 13% 성장)\n>> ACIE 매출 : 400억 달러 (전분기 대비 25% 성장)\n> 마진율은 75% (예상치에 부합) >> 메모리 등 가격 상승으로 인해 마진율은 조금 떨어질 거라고 미리 예고 >> 3분기(74% 정도), 4분기(71~72%), 2028회계연도(72~73%) 예상\n> 주당순이익 :  $2.22 (예상치 $2.10달러 상회)\n> 엔비디아 DSX 레퍼런스 디자인을 활용 > 엔비디아의 네오클라우드 파트너들은 [더 빠른 속도로, 더 낮은 토큰 비용]으로 연산 캐파를 가동 중\n* 연산 캐파는 2025년 말 기준 3GW 에서 2026년 말 기준 8GW로 확대 예정입니다.\n> 일정 :  9월 10일 샌프란시스코 골드만삭스 기술 컨퍼런스 / 10월 21일 베를린 GTC 키노트 / 11월 17일 3분기 실적발표가\n\n- 엔비디아 _ 자본조달\n1. 수익 공유구조 _ 블랙락, 블랙스톤, KKR, 골드만삭스 등 금융사들과 $500B 규모 제3자 자본 조달 금융 플랫폼\n> 대출기관들이 통상적으로 요구하던 단일 장기 offtake(인수) 보장에 전체 용량을 배정하는 대신,\n엔비디아가 시설 용량 일부에 대해 take-or-pay 약정을 제공해 최소한의 매출을 보장하고,\n이런 보증을 해주는 대가로 그 하한선을 초과해 벌어들이는 매출의 일부는 공유받는 수익 공유 구조\n* ‘클라우드 사업에 진출하지 않고 클라우드 사업에 진출했다’고 해석\n\n## 엔비디아가 주도하는 엔비디아 DSX 클라우드는 표준화되어 있고 상호 대체 가능(fungible)하기 때문에\n한 수요자가 빠지더라도 얼마든지 다른 고객으로 대체할 수 있고 그래서 높은 신용평가를 주기 수월하다고 합니다.\n‘Fungible’하다는 것은 결국에 수요 변화에 유연하게 대응할 수 있고, 데이터센터와 장비의 사용기간과 감가상각 기간이 훨씬 늘어날 수 있다는 것이기 때문에\n엔비디아 DSX 클라우드는 AI 인프라의 수익성을 높여주는 주요 요인\n\n- 마이클버리, 잠깐 엔비디아 롱\n> 엔비디아를 숏치고 있는 마이클 버리도 엔비디아 실적발표를 앞두고 '헷지'를 위해 엔비디아 롱 포지션을 열었다고 밝혔는데, 실적발표 후 4% 상승\n> 메인 포지션인 오라클, 팔란티어, 네비우스, 엔비디아, 캐터필러 숏은 오히려 더 늘림"}, {"date": "2026. 8. 28", "sortDate": "2026-08-28", "title": "호재 활용을 잘 하는 것도 능력이다...! (아이렌 실적발표)", "core": "- IREN 회계 연도 실적\n> 매출 : $137.2M (전분기 $144.8M)\n>> 비트코인 매출 : $66.7M (전분기 $111.2M)\n>> AI 매출 : $70M(전분기 $33.6M 대비 두 배) \n> 주당순이익 : -$2.04 (Est -$0.61)\n> 계약 \n>> ‘leading frontier AI lab’ : 프론티어 AI 역량이 있는 오픈AI나 앤스로픽, 구글, 메타, 스페이스X 중 하나 \n* 계약 조건도 multi-year 중장기 계약 > 시장이 이걸 호재로 받아들이려면 구체적인 내용이 공개될 때\n>> 저번에 이름을 밝히지 않은 미스테리 고객(new leading AI developer) : (추정) 프로메테우스 \n* 프로메테우스 : 아마존 CEO, 제프 베조스의 기업 (굳이 미스테리로..?)\n>> 3~5년 계약 단가가 작년 11월 이후 +125% 상승, 엔터프라이즈 고객을 대상으로 한 MW당 단가가 기존보다 올라간 $20~25M (현재 네비우스와 코어위브 단가와 같은 조건)\n> ARR \n>> Contracted ARR : $4B (계약 확보가 다 된 상태) > (연말기준으로) 맥킨지 사이트와 Horizon 2~4 까지 목표\n>> Operating ARR : $1B (Prince George와 Horizon 1)\n> 자금조달 현황\n>> GPU 조달 : 기존 1% 전환사채를 선택하지 않고 일반 채권 발행을 선택 > CapEx : GPU(2/3)+데이터센터 건설(1/3) > 이 채권 조달로 GPU에 필요한 자본지출의 90%\n* 마이크로소프트 계약은 하이퍼스케일러 : 6% 이자율 \n* 나머지 엔터프라이즈 고객 계약 :  9% 이자율\n>> 고객 선급금 45~55% : 위 채권발행 금액에 더하면, 총 조달 규모는 실제 GPU에 필요한 돈보다 훨씬 더 많아진다 > 고객의 선급금은 GPU가 아닌 나머지 데이터센터 구축에 활용할 수 있다는 뜻\n>> 데이터센터 자산은 100% 무담보로 유지(GPU외 모두) : 적절한 시점에 이를 담보로 한 금융도 일으킬 수 있다 > 자금조달 측면에서 긍정적인 점 (*키 포인트가 될 수 있을지 기대)\n> 2027년 6월까지 CapEx : $25B~30B (2026년 $4B ARR 달성을 위해 필요한 모든 deployment CapEx가 포함됨\n>> $22B : GPU 담보금융과 선급금으로 처리\n>> $3~8B 정도는 전환사채나 유상증자 등\n* $14B 이미 확보자금 + 약 $8B 추가 GPU 금융/선급금 + 향후 데이터센터 담보금융 등으로 조달할 계획\n> 다니엘 로버츠 (왈) : \n>> 현재는 장기계약을 통해 고객 기반을 확대하고 AI 생태계 전반으로 고객을 다변화하며, 장기계약을 바탕으로 저렴한 금융까지 확보하는 전략이 더 중요\n>> 스페인 490MW가 전부 Badajoz에 있는 것은 아니며, Badajoz 약 300MW + 기타 여러 스페인 개발사이트로 구성된다.\n>> 과거에는 신용등급이 높은 고객을 확보해야 저렴한 금융을 얻을 수 있다는 제약이 있었지만 지금은 다양한 고객 유형에 대해서도 매력적인 금융조건을 받을 수 있다.\n>> [Hyperscaler : 대규모 용량 + 긴 계약기간 + 저렴한 자본] vs [Enterprisev : 더 높은 판매가격 + 좋은 선급금 조건 + 높은 성장성]\n* IREN은 둘 중 하나만 선택하기보다 이 둘을 섞으면서 유연성을 유지하려 한다.\n>> 고객 수요가 존재하는지는 이제 더 이상 큰 의문이 아니라고 본다. IREN의 핵심 과제는 Capital Flywheel을 얼마나 효율적으로 운영하느냐다.\n>> 부동산 금융시장이 완성되는 데 수년~10년이 걸렸다면 AI 인프라 금융시장은 몇 달, 몇 분기 만에 형성되고 있다는 것이다.\n>> GPU 금융시장은 이미 상당히 발전했고 Data Center Financing도 발전하고 있다.\n오히려 데이터센터는 전통 금융 관점에서 부동산·인프라 자산과 훨씬 비슷하기 때문에 금융상품을 만들기가 상대적으로 쉽다."}, {"date": "2026. 8. 29", "sortDate": "2026-08-29", "title": "예상보다 금리 인상에 적극적이었던 케빈 워시의 잭슨홀 연설 분석", "core": "- 케빈워시, 잭슨홀 미팅\n> ‘금리 인상(hike)’과 같은 단어인 잭슨홀에서의 ‘등산(hike)’ 경험으로 시작  > ‘금리 인상’을 기다리는 채권시장에 암시를 주거나 암시를 주는 척을 함으로써 시장을 안심시키려는 의도가 아닌지 생각\n\n##발표 주제\n1. 첫 번째는 AI와 AI가 경제에 끼칠 영향에 대해서, \n: AI는 모두의 예측을 깨는 엄청난 성장을 보여주고 있고, 연준도 그 생산성 증가 잠재력을 주시하고 있다.\n별도의 태스크포스가 이를 분석하고 있기 때문에, AI의 영향을 잘 파악할 준비가 되어 있다.\n2. 두 번째는 포워드 가이던스의 본질, 중앙은행과 시장 사이의 관계에 대해서,\n: 우리도 잘 못맞추고 우리도 잘 모른다. 그러니까 우리에게 의지하지 마. 시장이 스스로 데이터를 보고, 스스로 리스크를 판단하고, 스스로 전망하길 원한다.\n3. 세 번째는 통화정책에 대한 기본 원칙들에 대해서,\n> 연준은 하나의 데이터 숫자만 보지 않고, 움직이는 트렌드, 추세를 중시하겠다 \n> 연준의 일은 경제의 전체적인 수요와 공급을 맞추기에는 구조적으로 부정확할 수밖에 없다고 인정 (공급의 실제 수준을 아는 건 불가능)\n> PCE 기준 인플레이션 목표 2%는 흔들림 없이 연준이 달성하고자 하는 목표 (물가 목표 변경은 없을 것이다)\n> 최대 고용도 연준의 책무\n> 물가상승률 2%와 최대 고용이라는 두 가지 목표를 달성하기 위해 오직 단기금리가 연준의 주요 도구\n> 가장 중요한 건 중앙은행과 금융시스템에서 나오는 돈(통화량)\n> '조용한 연준', 필요할 때만 커뮤니케이션하는 연준이 목표를 달성할 확률이 더 높다\n>> 결국 신뢰는 말이 아니라 결과에서 나오고, 커뮤니케이션보다는 정확한 정책 판단을 하는 데 집중하겠다\n4. 네 번째는 현재 경제에서 벌어지고 있는 일에 대한  케빈 워시 개인의 생각을 전달하겠다고 예고\n> \"인플레이션이 목표를 향해 '명확하고 충분히 빠른 속도로' 내려가고 있다\" 라는 확신이 있어야 한다\n> 더 확실한 물가 안정 지표가 나와야만 금리를 동결하겠다는 듯한 말\n> 30년물 금리가 5.3%인데도 금융여건은 긴축적이지 않으며,  노동시장은 완전고용 상태이고, 연준의 이중책무는 서로 상충하는 방향으로 작용하지 않고 있다.\n> 미국 증시 역사상 최고 수준의 실적발표 시즌이었고, CapEx 투자는 늘고 있기 때문에 경제는 아주 강하다\n\n한정수 (왈) : 일단은 트럼프 행정부의 의도를 가장 잘 보여주는 베센트 재무장관의 멘트들을 따라가는 게 가장 합리적인 투자라고 생각\n엔화가 흔들리고 전쟁이 시끄럽고 채권시장이 발작하는 현 상황을 베센트 재무장관이 다양한 방법으로 해결하고 찍어누르는 시나리오를 기반으로 투자 전략을 짜고 있습니다."}]</script>

      const wrap=document.createElement('div');wrap.className='formatted-core';
      let current=null;
      String(raw).split(/\n+/).map(lineParts).forEach(part=>{
        if(!part.text)return;
        if(part.kind==='section'||part.additional||(!current&&part.level===0)){
          current=openBlock(wrap,part);
          return;
        }
        if(!current)current=openBlock(wrap,{text:'메모',additional:false});
        pushLine(current.lines,part);
      });
      return wrap;
    }
    function filtered(){const needle=q.trim().toLowerCase();if(!needle)return diaries.map((d,i)=>({...d,i}));return diaries.map((d,i)=>({...d,i})).filter(d=>`${d.date} ${d.title} ${d.core}`.toLowerCase().includes(needle));}
    function grouped(){return filtered().reduce((acc,d)=>{const dt=parseDate(d.sortDate),m=monthLabel(dt),w=weekLabel(dt);(acc[m]??={})[w]??=[];acc[m][w].push(d);return acc;},{})}
    function show(i){active=i;const d=diaries[i],dt=parseDate(d.sortDate);$('meta').textContent=`${monthLabel(dt)} · ${weekLabel(dt)} · ${d.date}`;$('title').textContent=d.title;$('body').innerHTML='';if(d.core){const section=document.createElement('section');section.className='note';const h=document.createElement('h3');h.textContent='핵심 내용';section.appendChild(h);section.appendChild(formatCore(d.core));$('body').appendChild(section);}else {$('body').innerHTML='<p class="empty">이 행은 원본 시트의 핵심 내용이 비어 있습니다.</p>';}render();$('article').scrollIntoView({behavior:'smooth',block:'start'})}
    function render(){const g=grouped(),months=Object.keys(g).sort((a,b)=>b.localeCompare(a,'ko'));$('count').textContent=diaries.length;$('months').textContent=new Set(diaries.map(d=>monthLabel(parseDate(d.sortDate)))).size;$('tree').innerHTML=months.map(m=>{const monthItems=Object.values(g[m]).flat().length;const mCollapsed=collapsedMonths.has(m);return `<div class="month ${mCollapsed?'collapsed':''}"><button class="month-btn" data-month="${m}"><span>${m}</span><span>${monthItems}개 ${mCollapsed?'펼치기':'접기'}</span></button><div class="week-wrap">${Object.keys(g[m]).sort((a,b)=>a.localeCompare(b,'ko')).map(w=>{const key=m+'|'+w, wCollapsed=collapsedWeeks.has(key);return `<div class="week ${wCollapsed?'collapsed':''}"><button class="week-btn" data-week="${key}"><span>${w}</span><span>${g[m][w].length}개 ${wCollapsed?'펼치기':'접기'}</span></button><div class="days">${g[m][w].map(d=>`<button class="day-btn ${d.i===active?'active':''}" data-i="${d.i}"><strong>${d.date}</strong><span>${escapeHtml(d.title)}</span></button>`).join('')}</div></div>`;}).join('')}</div></div>`;}).join('');document.querySelectorAll('.month-btn').forEach(b=>b.onclick=()=>{const k=b.dataset.month;collapsedMonths.has(k)?collapsedMonths.delete(k):collapsedMonths.add(k);render();});document.querySelectorAll('.week-btn').forEach(b=>b.onclick=()=>{const k=b.dataset.week;collapsedWeeks.has(k)?collapsedWeeks.delete(k):collapsedWeeks.add(k);render();});document.querySelectorAll('.day-btn').forEach(b=>b.onclick=()=>show(+b.dataset.i));}
    $('search').oninput=e=>{q=e.target.value;render();};show(active);
    fetch(`${SUPABASE_URL}/rest/v1/`,{headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`}}).then(r=>$('sb').textContent=r.ok?'연결됨':'오류').catch(()=>$('sb').textContent='오류');
  </script>
</body>
